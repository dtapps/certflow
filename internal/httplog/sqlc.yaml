version: "2"
sql:
  - engine: "sqlite"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "database/sql"
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "http_log.request_headers"
            go_type:
              import: "database/sql"
              type: "NullString"
          - column: "http_log.response_headers"
            go_type:
              import: "database/sql"
              type: "NullString"
          # BLOB 可选字段：标准库无 sql.NullBytes，emit_pointers_for_null_types 下
          # 可空 BLOB 默认生成 *[]byte 表达 NULL，无需额外 override。
          - column: "http_log.created_at"
            go_type:
              import: "database/sql"
              type: "NullTime"
