"**":
  # 发布 nightly 预发布版本（从 GitHub 的 nightly Release 下载产物，转发到 CNB）
  web_trigger_nightly:
    - runner:
        tags: cnb:arch:amd64
        cpus: 4
      imports: https://cnb.cool/dtapp/envs/-/blob/main/github.yml # 导入外部环境变量/配置
      stages:
        - name: 处理版本号
          script: |
            # nightly 版本使用固定标签 nightly
            version="nightly"
            echo "Nightly 标签: $version"
            echo "##[set-output interior_version=$version]"
            # 叠加模式：true=更新已有 Release，false=删除后重建（首次发布需 false）
            echo "##[set-output overlying=${overlying}]"
          exports:
            interior_version: INTERIOR_VERSION
            overlying: OVERLYING

        - name: 从 GitHub Release 下载构建产物
          script: |
            TAG="${INTERIOR_VERSION}"
            GITHUB_API="https://api.github.com/repos/dtapps/certflow"
            DOWNLOAD_DIR="dist"
            mkdir -p "${DOWNLOAD_DIR}"

            # 带重试的 curl（最多 3 次，间隔 5 秒）
            curl_retry() {
              local max=3 i=1
              while [ $i -le $max ]; do
                if output=$("$@" 2>&1); then
                  echo "$output"
                  return 0
                fi
                echo "  ⚠ 第 ${i}/${max} 次失败，5 秒后重试..."
                sleep 5
                i=$((i + 1))
              done
              echo "  ✗ 重试 ${max} 次后仍然失败"
              echo "$output"
              return 1
            }

            HTTP_CODE=$(curl_retry curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
              "${GITHUB_API}/releases/tags/${TAG}")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "错误：GitHub 上未找到 ${TAG} 的 Release（HTTP ${HTTP_CODE}）"
              exit 1
            fi
            echo "✓ 找到 GitHub Release: ${TAG}"

            RELEASE_INFO=$(curl_retry curl -s \
              -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
              "${GITHUB_API}/releases/tags/${TAG}")
            ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
            echo "共 ${ASSET_COUNT} 个附件"

            # 保存 Release 信息，供后续替换下载链接生成发布内容使用
            echo "$RELEASE_INFO" > release_info.json

            if [ "$ASSET_COUNT" = "0" ]; then
              echo "错误：Release 没有附件，请先在 GitHub Actions 完成 nightly 构建"
              exit 1
            fi

            for i in $(seq 0 $((ASSET_COUNT - 1))); do
              ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].name")
              ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
              echo "下载 ${ASSET_NAME}..."
              curl_retry curl -sL \
                -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
                -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
              echo "  ✓ 完成"
            done

            echo ""
            echo "下载完成："
            ls -lh "${DOWNLOAD_DIR}/"

        # 生成发布内容（直接复用 GitHub Release 正文，下载链接替换为 CNB）
        - name: 生成发布内容
          script: |
            TAG="${INTERIOR_VERSION}"
            GH_DL_PREFIX="https://github.com/dtapps/certflow/releases/download/${TAG}"
            CNB_DL_PREFIX="https://cnb.cool/dtapp/certflow/-/releases/download/${TAG}"

            # 复用 GitHub Release 的完整正文（含其原有下载表格），
            # 仅把下载链接前缀由 GitHub 替换为 CNB，避免单独生成表格导致与 GitHub 不同步
            RELEASE_INFO=$(cat release_info.json)
            echo "$RELEASE_INFO" | jq -r '.body // ""' \
              | sed "s#${GH_DL_PREFIX}#${CNB_DL_PREFIX}#g" \
              > release_body.md

            cat release_body.md

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 创建 Release
          type: git:release
          options:
            tag: ${INTERIOR_VERSION}
            title: "Nightly Build"
            descriptionFromFile: release_body.md
            preRelease: true
            overlying: ${OVERLYING}

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - "dist/*"
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
