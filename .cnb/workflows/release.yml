"**":
  # 自定义按钮可触发的事件：web_trigger_*
  web_trigger_release:
    - runner:
        tags: cnb:arch:amd64
        cpus: 4
      imports: https://cnb.cool/dtapp/envs/-/blob/main/github.yml # 导入外部环境变量/配置
      stages:
        - name: 处理版本号
          script: |
            if ! echo "$version" | grep -qE '^v'; then
              version="v${version}"
            fi
            echo "版本号: $version"
            echo "##[set-output interior_version=$version]"
          exports:
            interior_version: INTERIOR_VERSION

        - name: 从 GitHub Release 下载构建产物
          script: |
            TAG="${INTERIOR_VERSION}"
            GITHUB_API="https://api.github.com/repos/dtapps/certflow"
            DOWNLOAD_DIR="dist"
            mkdir -p "${DOWNLOAD_DIR}"

            # 带重试的 curl（最多 3 次，间隔 5 秒）
            curl_retry() {
              local max=3 i=1
              while [ $i -le $max ]; do
                if output=$("$@" 2>&1); then
                  echo "$output"
                  return 0
                fi
                echo "  ⚠ 第 ${i}/${max} 次失败，5 秒后重试..."
                sleep 5
                i=$((i + 1))
              done
              echo "  ✗ 重试 ${max} 次后仍然失败"
              echo "$output"
              return 1
            }

            HTTP_CODE=$(curl_retry curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
              "${GITHUB_API}/releases/tags/${TAG}")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "错误：GitHub 上未找到 ${TAG} 的 Release（HTTP ${HTTP_CODE}）"
              exit 1
            fi
            echo "✓ 找到 GitHub Release: ${TAG}"

            RELEASE_INFO=$(curl_retry curl -s \
              -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
              "${GITHUB_API}/releases/tags/${TAG}")
            ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
            echo "共 ${ASSET_COUNT} 个附件"

            if [ "$ASSET_COUNT" = "0" ]; then
              echo "错误：Release 没有附件，请先在 GitHub Actions 完成构建"
              exit 1
            fi

            for i in $(seq 0 $((ASSET_COUNT - 1))); do
              ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].name")
              ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
              echo "下载 ${ASSET_NAME}..."
              curl_retry curl -sL \
                -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
                -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
              echo "  ✓ 完成"
            done

            echo ""
            echo "下载完成："
            ls -lh "${DOWNLOAD_DIR}/"

            # 提取 GitHub Release 的更新日志（只取"## 更新内容"部分，跳过下载表格）
            echo "$RELEASE_INFO" | jq -r '.body // ""' | sed -n '/^## 更新内容/,$p' | tail -n +2 | sed '/./,$!d' > github_changelog.md
            echo "✓ 更新日志已保存到 github_changelog.md"

        # 生成完整发布内容（下载表格 + GitHub 更新日志）
        - name: 生成发布内容
          script: |
            TAG="${INTERIOR_VERSION}"
            CNB_DL_BASE="https://cnb.cool/dtapp/certflow/-/releases/download/${TAG}"

            # 下载表格
            printf "## 下载\n\n" > release_body.md
            printf "| 平台 | 架构 | 文件 | 大小 | 说明 |\n" >> release_body.md
            printf "|------|------|------|------|------|\n" >> release_body.md

            for f in dist/*; do
              [ ! -f "$f" ] && continue
              fname=$(basename "$f")
              fsize=$(ls -lh "$f" | awk '{print $5}')
              DL_URL="${CNB_DL_BASE}/${fname}"

              PLAT=""
              ARCH=""
              case "$fname" in
                *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
                *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
                *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
                SHA256SUMS)  PLAT="校验和"; ARCH="-" ;;
              esac

              case "$fname" in
                *.zip)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Mac 应用 |\n" "${fname%.zip}.app" "$fsize" >> release_body.md ;;
                *.exe)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Windows 安装包 |\n" "$fname" "$fsize" >> release_body.md ;;
                *.AppImage)    printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | AppImage 便携版 |\n" "$fname" "$fsize" >> release_body.md ;;
                *.deb)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Debian/Ubuntu |\n" "$fname" "$fsize" >> release_body.md ;;
                *.rpm)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Fedora/RHEL |\n" "$fname" "$fsize" >> release_body.md ;;
                *.pkg.tar.zst) printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Arch Linux |\n" "$fname" "$fsize" >> release_body.md ;;
                SHA256SUMS)    printf "| ${PLAT} | - | [%s](${DL_URL}) | %s | SHA-256 |\n" "$fname" "$fsize" >> release_body.md ;;
              esac
            done

            # 拼接 GitHub 更新日志
            if [ -s github_changelog.md ]; then
              printf "\n## 更新内容\n\n" >> release_body.md
              cat github_changelog.md >> release_body.md
            fi

            # 输出完整内容（供 git:release 引用）
            cat release_body.md

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 创建 Release
          type: git:release
          options:
            tag: ${INTERIOR_VERSION}
            title: "${INTERIOR_VERSION}"
            descriptionFromFile: release_body.md

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - "dist/*"
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
