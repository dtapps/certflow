"**":
  # 自定义按钮可触发的事件：web_trigger_*
  web_trigger_release:
    - runner:
        tags: cnb:arch:amd64
        cpus: 4
      stages:
        - name: 处理版本号
          script: |
            if ! echo "$version" | grep -qE '^v'; then
              version="v${version}"
            fi
            echo "版本号: $version"
            echo "##[set-output interior_version=$version]"
          exports:
            interior_version: INTERIOR_VERSION

        - name: 从 GitHub Release 下载构建产物
          script: |
            TAG="${INTERIOR_VERSION}"
            GITHUB_API="https://api.github.com/repos/dtapps/certflow"
            DOWNLOAD_DIR="dist"
            mkdir -p "${DOWNLOAD_DIR}"

            # 检查 GitHub Release 是否存在
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${GITHUB_API}/releases/tags/${TAG}")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "错误：GitHub 上未找到 ${TAG} 的 Release"
              exit 1
            fi
            echo "✓ 找到 GitHub Release: ${TAG}"

            # 下载所有附件
            RELEASE_INFO=$(curl -s "${GITHUB_API}/releases/tags/${TAG}")
            ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
            echo "共 ${ASSET_COUNT} 个附件"

            for i in $(seq 0 $((ASSET_COUNT - 1))); do
              ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].name")
              ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
              echo "下载 ${ASSET_NAME}..."
              curl -sL -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
              echo "  ✓ 完成"
            done

            echo ""
            echo "下载完成："
            ls -lh "${DOWNLOAD_DIR}/"

        - name: 从 GitHub Release 获取发布内容并替换下载链接
          script: |
            TAG="${INTERIOR_VERSION}"
            GITHUB_API="https://api.github.com/repos/dtapps/certflow"
            RELEASE_INFO=$(curl -s "${GITHUB_API}/releases/tags/${TAG}")
            BODY=$(echo "$RELEASE_INFO" | jq -r '.body // empty')

            if [ -n "$BODY" ]; then
              CNB_DL_BASE="https://cnb.cool/dtapp/certflow/releases/download/${TAG}"
              CNB_BODY=$(echo "$BODY" \
                | sed "s|https://github.com/dtapps/certflow/releases/download/${TAG}/|${CNB_DL_BASE}/|g")
            else
              CNB_BODY="Release ${TAG}"
            fi

            echo "发布内容："
            echo "$CNB_BODY"
            echo "##[set-output latestChangeLog=$CNB_BODY]"
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 创建 Release
          type: git:release
          options:
            tag: ${INTERIOR_VERSION}
            title: "${INTERIOR_VERSION}"
            description: ${LATEST_CHANGE_LOG}

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - "dist/*"
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
