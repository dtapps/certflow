# 发布 Release（从 GitHub 下载 release 构建产物并发布到 CNB）
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，与 GitHub 的 release.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 不是版本号本身，会自动展开成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>：
#                               定时任务（每天 UTC 00:00）用它；手动执行填 nightly
#                               同样会展开（基版本取最近正式版，日期取执行当天的 UTC 日期）。
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#
# 「是不是预发布」只看版本号后缀，不再接受页面上的 pre_release 勾选：
# 布尔输入会和版本号打架（此前 UI 勾了预发布但版本号是 1.0.0，就会发出一个
# prerelease=true 却挂着正式版本号的 Release）。
# CERTFLOW_GITHUB_TOKEN 去 envs 里配置环境变量
.trigger_release: &trigger_release
  runner:
    tags: cnb:arch:amd64 # 指定 Runner 必须有这个标签
  services:
    - docker # 启用 Docker 服务（用于 docker build/push）
  docker:
    image: docker.cnb.cool/dtapp/golang/wails3:latest # 使用统一 Docker 镜像，避免各仓库重复打包
    volumes:
      - /root/.cache/go-build:copy-on-write # Go 构建缓存 - 加速编译
      - /root/.local/share/pnpm/store:copy-on-write # pnpm 全局存储 - 加速前端依赖安装
      - /go/pkg/mod:copy-on-write # 仅缓存 Go 模块下载，避免覆盖镜像内预装的 /go/bin 工具
  # 导入外部环境变量/配置。多文件必须用 YAML 数组（逗号分隔字符串不生效）；
  # 同名变量后面的覆盖前面的，故项目专属的 certflow.yml 放在通用 github.yml 之后。
  imports:
    - https://cnb.cool/dtapp/envs/-/blob/main/github.yml
    - https://cnb.cool/dtapp/envs/-/blob/main/certflow.yml
  # 公告评论的两个开关/内容（job 级 env，所有 stage 都能读到）：
  # - ANNOUNCEMENT_COMMENT_ENABLED：是否在公告 Issue 上追加评论（true / false）；
  # - ANNOUNCEMENT_COMMENT_TEXT：评论内容，默认让仓库里的 NPC（CodeBuddy）按「对比哪两个
  #   tag」整理一份用户友好的更新日志，并以评论形式发回。
  #
  # ⚠️ {{PREVIOUSTAG}} / {{CURRENTTAG}} 不是 CNB 的模板语法：env 里的值就是字面量，
  #   流水线不会替我们替换，直接发出去就是两个花括号。真实 tag 在「发布公告评论」stage
  #   发评论前用 sed 换掉（基准 tag 由「准备发版公告」stage 调
  #   scripts/ci/resolve-prev-tag.sh 算出并落盘）。所以模板里**不要出现 | 和 &**：
  #   sed 用 | 当分隔符，& 在替换串里是特殊字符。
  env:
    ANNOUNCEMENT_COMMENT_ENABLED: 'true'
    ANNOUNCEMENT_COMMENT_TEXT: |-
      @CodeBuddy 请对比标签 {{PREVIOUSTAG}} 和 {{CURRENTTAG}} 的差异（git log / git diff {{PREVIOUSTAG}}...{{CURRENTTAG}}），整理一份用户友好的更新日志，并作为评论发布在这里。
      要求：
      1. 忽略所有测试文件和文档文件的改动，只写用户能感知到的变更；
      2. 按「新增 / 变更 / 修复 / 破坏性变更」分组，每条一句话说清对用户的影响，不要罗列提交哈希和纯内部重构；
      3. 与上方公告里的「更新内容」保持一致，不要出现两套说法；取不到 git 历史时，就直接按上方公告的内容改写。
  stages:
    - name: 处理版本号与选项
      script: |
        # 先切到本次发布对应的 commit：GitHub 侧同步时通过 API 的 env 传下来（commit）。
        # 目的是让下游跑**发布那一版**的脚本（如 scripts/ci/resolve-prerelease.sh），
        # 而不是本仓库分支头的最新版 —— 发版用的 commit 可能还没进分支头。
        #
        # 只用**本仓库自己的 origin**取（不跨平台去 GitHub 拉）：本仓库是权威源，
        # commit 迟早会同步过来；同步还没到就沿用分支头，不阻断同步。
        if [ -n "${commit:-}" ]; then
          echo "检出发布对应的 commit: ${commit}"
          if git rev-parse --verify -q "${commit}^{commit}" >/dev/null 2>&1; then
            git checkout -q "${commit}" && echo "✓ 工作区已有该 commit，直接切过去"
          elif git fetch --depth 1 origin "${commit}" >/dev/null 2>&1 &&
            git checkout -q FETCH_HEAD; then
            echo "✓ 已从 origin 检出该 commit"
          else
            echo "⚠ 本仓库还没有该 commit（同步还没到），继续用分支头"
          fi
        else
          echo "未提供 commit，沿用分支头"
        fi

        # 版本号归一化 / 格式校验 / 预发布判定只有一份实现：scripts/ci/resolve-prerelease.sh，
        # GitHub 的 .github/workflows/release.yml 也 source 它，避免两边各写一套 grep 正则、
        # 口径慢慢跑偏。
        #
        # 「是不是预发布」只看版本号后缀（rc / beta / alpha / nightly），不接受人工勾选：
        # 布尔输入会和版本号打架（此前 pre_release 与 version 就是两套口径）。
        # shellcheck source=scripts/ci/resolve-prerelease.sh
        . scripts/ci/resolve-prerelease.sh
        resolve_version "$version" || exit 1
        echo "$PRE_NOTE"

        # 通过 set-output 输出到 result，由下方 exports 映射成后续 stage 的环境变量。
        echo "##[set-output interior_version=$TAG]"
        echo "##[set-output interior_prerelease=$PRERELEASE]"
      exports:
        interior_version: INTERIOR_VERSION
        interior_prerelease: INTERIOR_PRERELEASE

    # 生成 Release 选项文件，供 git:release 的 optionsFrom 读取。
    #
    # 为什么不用 options 里的 ${INTERIOR_PRERELEASE} 直接插值：preRelease 的类型是严格的
    # Boolean，而变量替换产出的是字符串 "false"，字符串在布尔位置上容易被当成真值，
    # 导致正式版也被勾成预发布。走 optionsFrom 读到的是 JSON 里真正的布尔值，没有这个歧义。
    # descriptionFromFile 同理：正文里有反引号、管道符和换行，塞进插值里容易被转义毁掉。
    - name: 生成 Release 选项文件
      script: |
        set -eu
        # 空值写进配置后 git:release 会当成脏配置，报错还落在「发布」那一步，跟真正的原因隔了三屏。
        # 空就直接死在这一步。
        : "${INTERIOR_VERSION:?INTERIOR_VERSION 为空——第一步没跑成功}"
        : "${INTERIOR_PRERELEASE:?INTERIOR_PRERELEASE 为空——第一步没跑成功}"

        # 标题统一带项目名前缀（与 GitHub 的 .github/workflows/release.yml 同口径，改名字两边一起改）
        project_name="CertFlow"

        if [ "${INTERIOR_PRERELEASE}" = "true" ]; then
          release_title="${project_name} ${INTERIOR_VERSION} (预发布)"
          prerelease_json=true
        else
          release_title="${project_name} ${INTERIOR_VERSION}"
          prerelease_json=false
        fi

        printf '{\n  "tag": "%s",\n  "title": "%s",\n  "descriptionFromFile": "release_body.md",\n  "preRelease": %s\n}\n' \
          "${INTERIOR_VERSION}" "${release_title}" "${prerelease_json}" > ./.cnb-release-options.json
        cat ./.cnb-release-options.json

    - name: 从 GitHub Release 下载构建产物
      script: |
        TAG="${INTERIOR_VERSION}"
        GITHUB_API="https://api.github.com/repos/dtapps/certflow"
        DOWNLOAD_DIR="dist"
        mkdir -p "${DOWNLOAD_DIR}"

        # 带重试的 curl（最多 3 次，间隔 5 秒）
        curl_retry() {
          local max=3 i=1
          while [ $i -le $max ]; do
            if output=$("$@" 2>&1); then
              printf '%s\n' "$output"
              return 0
            fi
            echo "  ⚠ 第 ${i}/${max} 次失败，5 秒后重试..."
            sleep 5
            i=$((i + 1))
          done
          echo "  ✗ 重试 ${max} 次后仍然失败"
          printf '%s\n' "$output"
          return 1
        }

        HTTP_CODE=$(curl_retry curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
          "${GITHUB_API}/releases/tags/${TAG}")

        if [ "$HTTP_CODE" != "200" ]; then
          echo "错误：GitHub 上未找到 ${TAG} 的 Release（HTTP ${HTTP_CODE}）"
          exit 1
        fi
        echo "✓ 找到 GitHub Release: ${TAG}"

        RELEASE_INFO=$(curl_retry curl -s \
          -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
          "${GITHUB_API}/releases/tags/${TAG}")
        ASSET_COUNT=$(printf '%s\n' "$RELEASE_INFO" | jq '.assets | length')
        echo "共 ${ASSET_COUNT} 个附件"

        # 保存 Release 信息，供后续替换下载链接生成发布内容使用
        printf '%s\n' "$RELEASE_INFO" > release_info.json

        if [ "$ASSET_COUNT" = "0" ]; then
          echo "错误：Release 没有附件，请先在 GitHub Actions 完成构建"
          exit 1
        fi

        for i in $(seq 0 $((ASSET_COUNT - 1))); do
          ASSET_NAME=$(printf '%s\n' "$RELEASE_INFO" | jq -r ".assets[$i].name")
          ASSET_URL=$(printf '%s\n' "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
          echo "下载 ${ASSET_NAME}..."
          curl_retry curl -sL \
            -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
            -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
          echo "  ✓ 完成"
        done

        echo ""
        echo "下载完成："
        ls -lh "${DOWNLOAD_DIR}/"

    # 生成发布内容（直接复用 GitHub Release 正文，下载链接替换为 CNB）
    - name: 生成发布内容
      script: |
        # 复用 GitHub Release 的完整正文（含其原有下载表格），
        # 把所有指向该仓库的 GitHub 链接（下载/标签/仓库页）统一替换为 CNB，
        # 避免单独生成表格导致与 GitHub 不同步。CNB 仓库路径为 dtapp/certflow
        # 且带 /-/ 前缀，故替换仓库根而非仅下载前缀，避免漏掉如
        # 「如需稳定版本，请使用 正式发布」这类指向 releases 发布页的链接。
        GH_BASE="https://github.com/dtapps/certflow"
        CNB_BASE="${CNB_REPO_URL_HTTPS%/}/-"
        RELEASE_INFO=$(cat release_info.json)
        printf '%s\n' "$RELEASE_INFO" | jq -r '.body // ""' \
          | sed "s#${GH_BASE}#${CNB_BASE}#g" \
          > release_body.md

        cat release_body.md

    # 删除已存在的 Release 与 Tag，再重建，避免旧附件堆积。
    # 两步均调用 CNB Open API，CNB_TOKEN 需 repo-release:rw 权限，
    # CNB_API_ENDPOINT 由流水线自动注入。注意：DeleteTag 不会自动删 Release，
    # DeleteRelease 也不会自动删 Tag，所以两个对象必须分别删除。
    - name: 删除已存在的 Release 与 Tag
      shell: true
      script: |
        set -e
        API="${CNB_API_ENDPOINT%/}"
        REPO="$CNB_REPO_SLUG"
        TAG="${INTERIOR_VERSION}"

        # ---- 第 1 步：删除 Release（发行版） ----
        # 查询：GET /-/releases/tags/{tag}  → 200 存在 / 404 不存在
        echo "查询是否已存在 release (tag=$TAG) ..."
        HTTP=$(curl -s -o /tmp/nr.json -w "%{http_code}" \
          -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/releases/tags/$TAG")
        if [ "$HTTP" = "200" ]; then
          ID=$(jq -r '.id // .release_id // empty' /tmp/nr.json)
          echo "release 已存在 (id=$ID)，删除后重新发布"
          # 删除：DELETE /-/releases/{id}  → 成功返回 204/200
          DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/releases/$ID")
          if [ "$DEL" = "204" ] || [ "$DEL" = "200" ]; then
            echo "已删除旧 release"
          else
            echo "删除 release 失败 HTTP=$DEL"; exit 1
          fi
        elif [ "$HTTP" = "404" ]; then
          echo "release 不存在，直接发布"
        else
          echo "查询 release 失败 HTTP=$HTTP"; cat /tmp/nr.json; exit 1
        fi

        # ---- 第 2 步：删除 Git Tag（标签） ----
        # 删除：DELETE /-/tags/{repo}/{tag}  → 204 成功 / 404 不存在
        # 该接口仅删 tag，不删关联 Release，故需在第 1 步之外单独删除。
        echo "删除同名 tag (tag=$TAG) ..."
        TAG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
          -X DELETE \
          -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/tags/$TAG")
        if [ "$TAG_HTTP" = "204" ] || [ "$TAG_HTTP" = "200" ]; then
          echo "已删除旧 tag"
        elif [ "$TAG_HTTP" = "404" ]; then
          echo "tag 不存在，跳过"
        else
          # 删 tag 失败不阻断发布（后续 git:release 会在已有 tag 上重建）
          echo "删除 tag 失败 HTTP=$TAG_HTTP（继续发布）"
        fi

    # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
    - name: 创建 Release
      type: git:release
      # tag / title / preRelease / description 全部来自上一步写出的 JSON。
      # 版本号带 -rc / -beta / -alpha / -nightly 后缀才勾选「预发布」，正式版不勾，
      # 不接受人工输入。overlying 默认 false（先删再建），与上方「删除已存在的 Release 与 Tag」一致。
      optionsFrom: ./.cnb-release-options.json

    # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
    - name: 上传 Release 附件
      image: cnbcool/attachments:latest
      settings:
        type: UPLOAD
        tag: ${INTERIOR_VERSION}
        attachments:
          - 'dist/*'
      exports:
        FILES: FILES

    - name: 输出 Release 附件
      script: echo $FILES

    # 发布到 CNB 后触发 Gitee 发布流水线，让 Gitee 从 CNB Release 搬附件。
    # 与 GitHub release.yml 的 sync-gitee 同口径（eventType=certflow-release），
    # 唯一区别：DOWNLOAD_SOURCE=cnb —— Gitee 端按 cnb 源下载（附件名固定、全程不碰
    # GitHub API），且 cnb 源匿名 401 查不到 tag，所以 VERSION 必须显式传。
    # WEBHOOK_URL / TOKEN 从 imports 的 envs 注入（与 GitHub 侧 secret 同名）。
    # allowFailure: true —— 此时 CNB Release 与附件已发完，同步失败或没配令牌都不能
    # 把这条流水线标红，否则上游 GitHub 的 sync-cnb 会误报「同步失败」。
    - name: 触发 Gitee 同步发布
      allowFailure: true
      script: |
        set -eu
        WEBHOOK_URL="${SYNC_GITEE_WEBHOOK_URL:-}"
        GITEE_TOKEN="${SYNC_GITEE_TOKEN:-}"
        if [ -z "$WEBHOOK_URL" ] || [ -z "$GITEE_TOKEN" ]; then
          echo "未配置 SYNC_GITEE_WEBHOOK_URL / SYNC_GITEE_TOKEN，跳过 Gitee 同步"
          exit 0
        fi

        VERSION="${INTERIOR_VERSION}"
        # commit 是构建元数据（搭车带给 Gitee，让它跑发布那一版的脚本），不参与判定；
        # 与第一步检出用的是同一个值（上游 API / web 触发时传下来的小写 commit）。
        COMMIT="${commit:-}"

        echo "触发 Gitee 发布流水线: ${VERSION} (commit=${COMMIT:-（无）}, source=cnb)"
        HTTP=$(curl -s -o /tmp/gitee-sync.json -w "%{http_code}" -X POST \
          -H "Authorization: Bearer ${GITEE_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"eventType\":\"certflow-release\",\"payload\":{\"params\":{\"VERSION\":\"${VERSION}\",\"COMMIT\":\"${COMMIT}\",\"DOWNLOAD_SOURCE\":\"cnb\"}}}" \
          "${WEBHOOK_URL}")
        echo "Gitee webhook 响应 HTTP=${HTTP}"
        cat /tmp/gitee-sync.json 2>/dev/null || true
        if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
          echo "⚠ 触发 Gitee 流水线失败（HTTP=${HTTP}），不影响 CNB Release"
        else
          echo "✓ 已请求 Gitee 执行发布流水线（异步执行，进度看 Gitee 流水线页面）"
        fi

    # 清理旧 nightly（与 GitHub release.yml 的「只保留最近 3 个」同口径）。
    # 镜像侧每天被动同步一次，tag 各不相同，不清理就会无限堆积（Release + tag + 附件）；
    # GitHub 侧删掉的旧 nightly 也不会自动从 CNB 消失。
    # 只处理日期 nightly（tag 以 -nightly.YYYYMMDD 结尾），rc / beta / alpha 与正式版一律不动。
    - name: 清理旧 nightly（只保留最近 3 个）
      script: |
        set -eu
        TAG="${INTERIOR_VERSION}"
        case "${INTERIOR_PRERELEASE}:${TAG}" in
          true:*-nightly.[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
          *) echo "非日期 nightly 发布（${TAG}），跳过清理"; exit 0 ;;
        esac

        # 清理是「尽力而为」：从这里开始关掉 errexit。stage 一红整条同步流水线就算失败，
        # 而发布本身已经完成了，所以任何一步失败只打印，不让 stage 失败。
        set +e

        API="${CNB_API_ENDPOINT%/}"
        REPO="$CNB_REPO_SLUG"

        # 列表形状兼容裸数组与 {items|list|data: [...]} 包装（与 mirror_updater.go 的解码口径一致）
        RAW=$(curl -sS -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/releases?page=1&page_size=100")
        if ! printf '%s' "$RAW" | jq -e . >/dev/null 2>&1; then
          echo "⚠ 获取 Release 列表失败，跳过 nightly 清理"
          printf '  响应：%s\n' "$(printf '%s' "$RAW" | head -c 200)"
          exit 0
        fi

        OLD_TAGS=$(printf '%s' "$RAW" | jq -r '
          (if type == "array" then . else (.items // .list // .data // []) end)
          | .[]
          | select((.draft // false) | not)
          | select(.prerelease == true)
          | .tag_name
          | select(test("-nightly\\.[0-9]{8}$"))
        ' 2>/dev/null | sort -rV || true)

        TOTAL=$(printf '%s\n' "$OLD_TAGS" | grep -c . || true)
        if [ "${TOTAL:-0}" -le 3 ]; then
          echo "nightly Release 共 ${TOTAL:-0} 个，无需清理"
          exit 0
        fi

        # 前 3 个是保留项，其余逐个删：DeleteRelease 不会连带删 tag，两个对象必须分别删。
        printf '%s\n' "$OLD_TAGS" | tail -n +4 | while IFS= read -r OLD; do
          [ -n "$OLD" ] || continue
          REL=$(curl -sS -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/releases/tags/$OLD")
          ID=$(printf '%s' "$REL" | jq -r '.id // .release_id // empty' 2>/dev/null)
          if [ -n "$ID" ]; then
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Accept: application/vnd.cnb.api+json" \
              "$API/$REPO/-/releases/$ID")
            case "$CODE" in
              200|204) echo "已删除旧 nightly release ${OLD}（id=${ID}）" ;;
              *) echo "⚠ 删除 release ${OLD}（id=${ID}）失败 HTTP=${CODE}" ;;
            esac
          else
            echo "⚠ 未取到 ${OLD} 的 release id，跳过删除"
          fi
          TCODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/tags/$OLD")
          case "$TCODE" in
            200|204) echo "已删除同名 tag ${OLD}" ;;
            *) echo "⚠ 删除 tag ${OLD} 失败 HTTP=${TCODE}" ;;
          esac
        done

    # 发布成功后同步开一条「发版公告」Issue。
    #
    # 为什么放在 CNB 侧：公告正文要引用 CNB 的 Release 下载链接，而 GitHub 侧发完版
    # 只是触发 CNB 同步，由 CNB 自己开公告最顺（也只开一条，不会两边各开一遍）。
    #
    # 为什么用官方 cnbcool/cnb-cli 插件而不是自己拼 OpenAPI：
    # CNB 没有「创建 Issue」的内置步骤（git:issue-update 只能改状态 / 标签 / 处理人，
    # 既不能创建、也不能改标题与正文），能创建 Issue 的官方工具就是 cnb-cli 插件
    # （官方 OpenAPI 命令行工具，CNB_TOKEN 由流水线自动注入）。
    #
    # ⚠️ 命令形态（v1.23.5 实测）：模块 / 工具用「位置参数」（cnb issues create-issue），
    # 选项用 --repo / --title / --body-file / --labels / --number / --state 这类长选项；
    # 不要写 cnb --module issues --tool create-issue——v1.23.5 的解析器会把 --module
    # 当成位置参数，报「工具函数 --module/issues 不存在」。
    #
    # 为什么拆成两个 stage：
    # - 「准备发版公告」跑在默认镜像里：只负责渲染正文与标题（不碰网络）；
    # - 「创建发版公告」「发布公告评论」跑在官方 CLI 镜像里：image 是任务级环境
    #   （见 CNB 文档「构建环境」），不会影响同一条流水线里其它 stage 用的镜像。
    #
    # 为什么失败不阻断：这一步跑在 Release 与附件都上传完之后，发布已经完成；
    # 这里红掉只会被 GitHub 侧 sync-cnb 记成「同步失败」，反而误导。所以只告警。
    - name: 准备发版公告
      # 只在非 nightly 版本执行：CNB 的 if 是一段 shell 脚本，退出码 0 才跑这个 stage。
      # nightly 每天一个 tag，每天开一条公告会把 Issue 列表刷成日报。
      if: &not_nightly |
        case "${INTERIOR_VERSION}" in
          *-nightly.*) exit 1 ;;
          *) exit 0 ;;
        esac
      script: |
        set -eu

        VERSION="${INTERIOR_VERSION}"
        PRERELEASE="${INTERIOR_PRERELEASE}"
        WEB_BASE="${CNB_REPO_URL_HTTPS%/}/-"

        # 公告正文与 Release 正文同源：下载表 / 校验 / 更新内容都取自 release_body.md，
        # 不在这里另编一套（格式见 scripts/ci/render-announcement-body.sh）。
        if [ ! -f scripts/ci/render-announcement-body.sh ]; then
          echo "⚠️ 缺少 scripts/ci/render-announcement-body.sh（发布用的提交里没有该脚本），跳过公告"
          exit 0
        fi

        export VERSION PRERELEASE
        export RELEASE_BODY="release_body.md"
        export OUT_FILE="announcement_body.md"
        export TITLE_FILE="announcement-title.txt"
        export CNB_WEB_BASE="${WEB_BASE}"
        export GITHUB_WEB="https://github.com/dtapps/certflow"
        export STABLE_URL="${WEB_BASE}/releases/latest"
        # stage 1 已切到本次发布的提交，HEAD 即发布提交。
        export COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"

        # 公告评论要指明「对比哪两个 tag」。基准必须和 Release 正文同口径（正式版对比
        # 上一个正式版，不掺 rc/beta），所以直接调 resolve-prev-tag.sh —— 它是正文
        # （release-changelog.sh）与这里共用的唯一一份判定，别另写一套 tag 排序。
        #
        # 补一次 tag 拉取：stage 1 用 `git fetch --depth 1 <commit>` 只取单个提交，
        # 不保证带 tag。加 --force 是为了覆盖被改动过的旧 tag；失败不阻断
        # （取不到就退回「按公告正文改写」）。
        # 故意不加 --depth：给一个完整克隆的仓库加 --depth 反而会把它变浅、截掉历史。
        git fetch --tags --quiet --force >/dev/null 2>&1 || true
        PREV_TAG="$(sh scripts/ci/resolve-prev-tag.sh "${VERSION}" 2>/dev/null || true)"
        # 落盘给下一步（评论 stage 跑在 cnb-cli 镜像里，不保证有 git，也不该重算一遍）。
        printf '%s' "${PREV_TAG}" > announcement-prev-tag.txt
        echo "对比基准 tag：${PREV_TAG:-（无，评论将按公告正文改写）}"

        # 渲染失败也不让发布流水线变红：正文渲染不出来只是少一条公告，
        # 而这里变红会被 GitHub 侧 sync-cnb 记成「同步失败」，反而误导。
        # 后面的步骤读不到标题会自动跳过（创建 stage 有缺失检查）。
        if ! sh scripts/ci/render-announcement-body.sh > /dev/null; then
          echo "⚠️ 生成公告正文失败，跳过发版公告"
          exit 0
        fi
        echo "公告正文已生成：${OUT_FILE}（标题见 ${TITLE_FILE}）"

    # 用官方 cnbcool/cnb-cli 插件创建 / 更新公告 Issue。
    #
    # Issue 一旦建出来就删不掉，所以这里严格「先查后改」：
    # 按标题找出所有同版本的公告，第一个更新、其余（历史重复）关掉。
    - name: 创建发版公告
      image: cnbcool/cnb-cli
      if: *not_nightly
      script: |
        set -eu

        REPO="${CNB_REPO_SLUG}"
        KEYWORD="${INTERIOR_VERSION}"
        LABEL="发版公告"
        BODY="announcement_body.md"

        TITLE="$(cat announcement-title.txt 2>/dev/null || echo '')"
        if [ -z "${TITLE}" ] || [ ! -f "${BODY}" ]; then
          echo "⚠️ 缺少公告标题或正文，跳过"
          exit 0
        fi

        # 1) 先把标签建好：仓库里没有「发版公告」这个标签时，带标签建 Issue 会被拒。
        #    标签已存在时接口报 400、CLI 退出码非 0，忽略即可。
        cnb repo-labels post-label \
          --repo "${REPO}" \
          --name "${LABEL}" \
          --color "1677ff" \
          --description "CertFlow 发版公告" \
          > /dev/null 2>&1 || echo "（标签可能已存在，忽略）"

        # 2) 先查：open / closed 各查一次（官方接口的 state 只列了 open 与 closed）。
        #    已关闭的公告也算「已经创建过」，照样更新，不能因为关了再建一条。
        for issue_state in open closed; do
          cnb issues list-issues \
            --repo "${REPO}" \
            --state "${issue_state}" \
            --keyword "${KEYWORD}" \
            --page 1 \
            --page-size 50 \
            > "announcement-list-${issue_state}.txt" 2>&1 || true
        done

        # 3) 从 CLI 输出里找「标题完全一致」的所有公告（不 exit：可能有多条历史重复）。
        #    输出是 util.inspect 风格（对象属性逐行），按「上一个 number 行 + 当前 title 行」配对；
        #    number 是字符串（官方 schema: type string，可能带引号），title 值也被引号包着，
        #    两边都先剥掉引号/逗号再比较，否则 v1.2.3 会误匹配 v1.2.30。
        numbers="$(cat announcement-list-open.txt announcement-list-closed.txt 2>/dev/null | awk -v t="${TITLE}" '
          /^[[:space:]]*(-[[:space:]]+)?number: / { v = $NF; gsub(/[^0-9]/, "", v); if (v != "") n = v }
          /^[[:space:]]*(-[[:space:]]+)?title: / {
            line = $0
            sub(/^[[:space:]]*(-[[:space:]]+)?title: /, "", line)
            gsub(/^[",]+|[",]+$/, "", line)
            if (line == t && n != "") print n
          }
        ' | sort -un || true)"

        if [ -n "${numbers}" ]; then
          number="$(printf '%s\n' "${numbers}" | head -1)"
          echo "已存在同版本公告（#${number}），改写正文"
          if cnb issues update-issue \
            --repo "${REPO}" \
            --number "${number}" \
            --title "${TITLE}" \
            --body-file "${BODY}" \
            > announcement-result.txt 2>&1; then
            echo "✓ 已更新发版公告 #${number}"
          else
            echo "⚠️ 更新发版公告失败，请手工改一下："
            cat announcement-result.txt 2>/dev/null || true
          fi

          # 同版本有多条时（历史上幂等失效留下的），**逐条更新成同一份内容**。
          # 不关闭任何一条：公告是给用户看的，关掉反而像「这个版本被撤了」。
          for other in $(printf '%s\n' "${numbers}" | tail -n +2); do
            if cnb issues update-issue \
              --repo "${REPO}" \
              --number "${other}" \
              --title "${TITLE}" \
              --body-file "${BODY}" \
              > /dev/null 2>&1; then
              echo "已同步更新同版本公告 #${other}"
            else
              echo "⚠️ 同步更新同版本公告 #${other} 失败，请手工处理"
            fi
          done

          # 编号落盘：下一步（发评论）要用它定位公告。
          printf '%s' "${number}" > announcement-number.txt
          exit 0
        fi

        echo "创建发版公告：${TITLE}"
        # CLI 的退出码就是结果：0 成功，3 = HTTP / 网络错误（输出里有 status: 400 等详情）。
        if cnb issues create-issue \
          --repo "${REPO}" \
          --title "${TITLE}" \
          --body-file "${BODY}" \
          --labels "${LABEL}" \
          > announcement-result.txt 2>&1; then
          echo "✓ 已创建发版公告"
        else
          # 仓库里还没有「发版公告」这个标签时，带标签创建会被拒；
          # 去掉标签再试一次，公告本身仍然发得出去。
          echo "带标签创建失败，去掉标签重试"
          if cnb issues create-issue \
            --repo "${REPO}" \
            --title "${TITLE}" \
            --body-file "${BODY}" \
            > announcement-result.txt 2>&1; then
            echo "✓ 已创建发版公告"
          else
            echo "⚠️ 创建发版公告失败，请手工补一条："
            cat announcement-result.txt 2>/dev/null || true
          fi
        fi

        # 把 Issue 编号落盘：下一步（发评论）要用它定位公告。
        # number 是字符串（可能带引号），.? 吃掉引号再取数字。
        issue_number="$(grep -oE 'number: .?[0-9]+' announcement-result.txt 2>/dev/null | head -1 | grep -oE '[0-9]+' || true)"
        if [ -n "${issue_number}" ]; then
          printf '%s' "${issue_number}" > announcement-number.txt
          echo "公告 Issue 编号：${issue_number}（已落盘，下一步用它发评论）"
        else
          echo "⚠️ 公告已创建但没解析到 Issue 编号，评论会跳过；下面是原始输出："
          head -20 announcement-result.txt 2>/dev/null || true
        fi

    # 在公告 Issue 上追加一条评论：把「整理一份用户友好的更新日志」交给仓库里的 NPC
    # （.cnb/settings.yml 里导入的 npc/CodeBuddy）去做，它会把整理好的日志作为评论发回来。
    #
    # 两个开关/内容在 job 级 env 里（见 .trigger_release 的 env 段）：
    # - ANNOUNCEMENT_COMMENT_ENABLED：是否发评论；
    # - ANNOUNCEMENT_COMMENT_TEXT：评论内容（只放提示语本身，不夹带更新内容——
    #   NPC 自己会读上面那条公告）。
    #
    # 提示语里的 {{PREVIOUSTAG}} / {{CURRENTTAG}} 由本 stage 替换成真实 tag：
    #   - CURRENTTAG 就是本次发布的 tag（INTERIOR_VERSION）；
    #   - PREVIOUSTAG 来自「准备发版公告」落盘的 announcement-prev-tag.txt，
    #     取不到（首次发这个渠道 / 补发历史版本）就换成一句文字说明，
    #     NPC 那边会退回「按公告正文改写」，不会拿着假 tag 去 diff。
    - name: 发布公告评论
      image: cnbcool/cnb-cli
      if: *not_nightly
      script: |
        set -eu

        REPO="${CNB_REPO_SLUG}"
        ENABLED="${ANNOUNCEMENT_COMMENT_ENABLED:-true}"

        case "$(printf '%s' "${ENABLED}" | tr '[:upper:]' '[:lower:]')" in
          1 | true | yes | on) ;;
          *)
            echo "发版公告评论已关闭（ANNOUNCEMENT_COMMENT_ENABLED=${ENABLED}）"
            exit 0
            ;;
        esac

        # 公告 Issue 的编号由「创建发版公告」落盘；没有编号说明公告没建成。
        NUMBER="$(cat announcement-number.txt 2>/dev/null || echo '')"
        if [ -z "${NUMBER}" ]; then
          echo "没有公告 Issue 编号（公告未创建或已被跳过），不追加评论"
          exit 0
        fi

        # 先替换占位符再落盘：env 里的 {{...}} 只是字面量，不替换就会原样发出去。
        # sed 用 | 作分隔符、& 在替换串里是特殊字符，所以模板里不允许出现这两个字符
        # （tag 已被 resolve-prerelease.sh 的字符白名单约束：只有 [0-9A-Za-z._+-]）。
        CUR_TAG="${INTERIOR_VERSION}"
        PREV_TAG="$(cat announcement-prev-tag.txt 2>/dev/null || true)"
        [ -n "${PREV_TAG}" ] || PREV_TAG='（首个版本，无对比基准）'

        # 评论内容只放提示语本身，不夹带更新内容：NPC 自己会读上面那条公告。
        printf '%s' "${ANNOUNCEMENT_COMMENT_TEXT:-}" \
          | sed "s|{{PREVIOUSTAG}}|${PREV_TAG}|g; s|{{CURRENTTAG}}|${CUR_TAG}|g" \
            > announcement-comment.md
        if [ ! -s announcement-comment.md ]; then
          echo "⚠️ 评论内容为空（ANNOUNCEMENT_COMMENT_TEXT），不追加评论"
          exit 0
        fi

        # 幂等：评论发出去也删不掉，重跑时先看这条公告下有没有同样的评论，有就不重复发。
        # 用评论正文的第一行做标记（默认提示语是单行；多行文案请保证首行唯一）。
        MARK="$(head -1 announcement-comment.md)"
        if [ -z "${MARK}" ]; then
          echo "⚠️ 评论第一行为空，无法做重复检查，直接发布"
        else
          cnb issues list-issue-comments \
            --repo "${REPO}" \
            --number "${NUMBER}" \
            --sort -created \
            --page-size 30 \
            > announcement-comment-list.txt 2>&1 || true

          if ! grep -q 'status: 2' announcement-comment-list.txt 2>/dev/null; then
            # 列表查不出来就没法判断「发过没」：宁可发一次（NPC 才会动），但要留痕。
            echo "⚠️ 查询已有评论失败，无法确认是否发过；仍会发布，请留意是否重复"
            cat announcement-comment-list.txt 2>/dev/null || true
          elif grep -qF -- "${MARK}" announcement-comment-list.txt 2>/dev/null; then
            echo "✓ 公告 #${NUMBER} 已有同样的评论，跳过（评论删不掉，不重复发）"
            exit 0
          fi
        fi

        if cnb issues post-issue-comment \
          --repo "${REPO}" \
          --number "${NUMBER}" \
          --body-file announcement-comment.md \
          > announcement-comment-result.txt 2>&1; then
          echo "✓ 已在公告 #${NUMBER} 上发布评论"
        else
          echo "⚠️ 发布公告评论失败，请手工补一条评论："
          cat announcement-comment-result.txt 2>/dev/null || true
        fi

master:
  # 手动触发：通过页面自定义按钮执行（预发布看版本号后缀，页面不再有勾选框）
  web_trigger_release:
    - *trigger_release

  # API 触发：由 GitHub Actions 发布 Release 后调用 CNB Open API 触发（event=api_trigger_release）
  # 需通过 env 传入 version 变量（如 {"version":"v1.2.3"} / {"version":"v1.2.3-rc.1"} / {"version":"v1.2.4-nightly.20260101"}）。
  # 预发布标记由 version 后缀推导，env 里的 pre_release 已废弃（传了也不看，避免两套口径打架）。
  api_trigger_release:
    - *trigger_release
