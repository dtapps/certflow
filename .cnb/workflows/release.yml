"**":
  # 自定义按钮可触发的事件：web_trigger_*
  web_trigger_release:
    - runner:
        tags: cnb:arch:amd64
        cpus: 4
      stages:
        - name: 处理版本号
          script: |
            if ! echo "$version" | grep -qE '^v'; then
              version="v${version}"
            fi
            echo "版本号: $version"
            echo "##[set-output interior_version=$version]"
          exports:
            interior_version: INTERIOR_VERSION

        - name: 从 GitHub Release 下载构建产物
          script: |
            TAG="${INTERIOR_VERSION}"
            GITHUB_API="https://api.github.com/repos/dtapps/certflow"
            DOWNLOAD_DIR="dist"
            mkdir -p "${DOWNLOAD_DIR}"

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "${GITHUB_API}/releases/tags/${TAG}")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "错误：GitHub 上未找到 ${TAG} 的 Release"
              exit 1
            fi
            echo "✓ 找到 GitHub Release: ${TAG}"

            RELEASE_INFO=$(curl -s "${GITHUB_API}/releases/tags/${TAG}")
            ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
            echo "共 ${ASSET_COUNT} 个附件"

            for i in $(seq 0 $((ASSET_COUNT - 1))); do
              ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].name")
              ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
              echo "下载 ${ASSET_NAME}..."
              curl -sL -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
              echo "  ✓ 完成"
            done

            echo ""
            echo "下载完成："
            ls -lh "${DOWNLOAD_DIR}/"

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/changelog.html
        - name: 生成 Release 日志
          image: cnbcool/changelog
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # 生成完整发布内容（下载表格 + 更新日志）
        - name: 生成发布内容
          script: |
            TAG="${INTERIOR_VERSION}"
            CNB_DL_BASE="https://cnb.cool/dtapp/certflow/releases/download/${TAG}"

            # 下载表格
            printf "## 下载\n\n" > /tmp/release_body.md
            printf "| 平台 | 架构 | 文件 | 大小 | 说明 |\n" >> /tmp/release_body.md
            printf "|------|------|------|------|------|\n" >> /tmp/release_body.md

            for f in dist/*; do
              [ ! -f "$f" ] && continue
              fname=$(basename "$f")
              fsize=$(ls -lh "$f" | awk '{print $5}')
              DL_URL="${CNB_DL_BASE}/${fname}"

              PLAT=""
              ARCH=""
              case "$fname" in
                *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
                *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
                *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
                SHA256SUMS)  PLAT="校验和"; ARCH="-" ;;
              esac

              case "$fname" in
                *.zip)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Mac 应用 |\n" "${fname%.zip}.app" "$fsize" >> /tmp/release_body.md ;;
                *.exe)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Windows 安装包 |\n" "$fname" "$fsize" >> /tmp/release_body.md ;;
                *.AppImage)    printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | AppImage 便携版 |\n" "$fname" "$fsize" >> /tmp/release_body.md ;;
                *.deb)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Debian/Ubuntu |\n" "$fname" "$fsize" >> /tmp/release_body.md ;;
                *.rpm)         printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Fedora/RHEL |\n" "$fname" "$fsize" >> /tmp/release_body.md ;;
                *.pkg.tar.zst) printf "| ${PLAT} | ${ARCH} | [%s](${DL_URL}) | %s | Arch Linux |\n" "$fname" "$fsize" >> /tmp/release_body.md ;;
                SHA256SUMS)    printf "| ${PLAT} | - | [%s](${DL_URL}) | %s | SHA-256 |\n" "$fname" "$fsize" >> /tmp/release_body.md ;;
              esac
            done

            # 拼接更新日志
            printf "\n## 更新内容\n\n" >> /tmp/release_body.md
            cat >> /tmp/release_body.md << CHANGELOG
            ${LATEST_CHANGE_LOG}
            CHANGELOG

            # 输出完整内容（供 git:release 引用）
            cat /tmp/release_body.md
          exports:
            latestChangeLog: LATEST_CHANGE_LOG

        # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
        - name: 创建 Release
          type: git:release
          options:
            tag: ${INTERIOR_VERSION}
            title: "${INTERIOR_VERSION}"
            description: ${LATEST_CHANGE_LOG}

        # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            type: UPLOAD
            tag: ${INTERIOR_VERSION}
            attachments:
              - "dist/*"
          exports:
            FILES: FILES

        - name: 输出 Release 附件
          script: echo $FILES
