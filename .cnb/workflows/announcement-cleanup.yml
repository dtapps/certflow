# 公告清理：每天 0 点检查带「发版公告」标签的 Issue，更新时间超过 7 天的自动关闭。
#
# crontab 说明（官方文档 + docs/2026-08-01.md 实测）：
# - 时区是 CNB 系统的 Asia/Shanghai（UTC+8），直接写 0 0 * * * 就是中国 0 点，不用换算 UTC；
# - 仅支持明确的单一分支（这里 master），最小间隔 5 分钟；
# - 定时任务的 CNB_TOKEN 以最后修改本配置的用户签发，默认只能访问当前仓库（够用：只关本仓库的 Issue）；
# - include 引入的定时任务只在 .cnb.yml 本身变更推送时才会同步（本次新增 include 行，正好会同步）。
#
# 关闭走官方 cnb-cli 插件的 update-issue（state: closed）。
# 筛选用 updated_time_end 而不是创建时间：接口没有按创建时间筛的参数，
# 公告 Issue 建出来就不再动，updated ≈ created；只有重发版本会刷新 updated——
# 那种刚被刷新过的公告本来就该继续挂着，用 updated_time_end 反而更合理。
#
# ⚠️ 命令形态（v1.23.5 实测）：模块 / 工具用「位置参数」（cnb issues list-issues），
# 选项用 --repo / --state / --labels / --labels-operator / --updated-time-end 这类长选项；
# 不要写 cnb --module issues --tool list-issues——v1.23.5 的解析器会把 --module
# 当成位置参数，报「工具函数 --module/issues 不存在」。
main:
  'crontab: 0 0 * * *':
    - runner:
        tags: cnb:arch:amd64
      env:
        # 公告多少天后过期（天）
        ANNOUNCEMENT_EXPIRE_DAYS: '7'
      stages:
        - name: 关闭过期的发版公告
          image: cnbcool/cnb-cli
          script: |
            set -eu

            REPO="${CNB_REPO_SLUG}"
            LABEL="发版公告"
            DAYS="${ANNOUNCEMENT_EXPIRE_DAYS:-7}"

            # cutoff：DAYS 天前的日期（YYYY-MM-DD）。
            # 不同镜像的 date 行为不一样：先试 GNU，再试 BSD，最后用 awk 兜底。
            cutoff="$(date -u -d "${DAYS} days ago" '+%Y-%m-%d' 2>/dev/null \
              || date -u -v-"${DAYS}"d '+%Y-%m-%d' 2>/dev/null \
              || awk -v d="${DAYS}" 'BEGIN { print strftime("%Y-%m-%d", systime() - d * 86400) }')"
            echo "过期阈值：更新时间早于 ${cutoff} 的发版公告会被关闭"

            # 官方 CLI 按条件筛：开放 + 带「发版公告」标签 + 更新时间早于 cutoff。
            cnb issues list-issues \
              --repo "${REPO}" \
              --state open \
              --labels "${LABEL}" \
              --labels-operator contains-all \
              --updated-time-end "${cutoff}" \
              --page 1 \
              --page-size 100 \
              > announcement-cleanup-list.txt 2>&1 || true

            # CLI 的退出码就是结果：0 成功，3 = HTTP / 网络错误（输出里有 status: 400 等详情）。
            if ! grep -q 'status: 2' announcement-cleanup-list.txt 2>/dev/null; then
              echo "⚠️ 查询发版公告列表失败，跳过清理："
              cat announcement-cleanup-list.txt 2>/dev/null || true
              exit 0
            fi

            # number 是字符串（可能带引号），.? 吃掉引号再取数字。
            numbers="$(grep -oE 'number: .?[0-9]+' announcement-cleanup-list.txt 2>/dev/null | grep -oE '[0-9]+' | sort -un || true)"
            if [ -z "${numbers}" ]; then
              echo "没有超过 ${DAYS} 天的发版公告，无需清理"
              exit 0
            fi
            echo "待关闭的发版公告：${numbers}"

            failed=0
            for n in ${numbers}; do
              if cnb issues update-issue \
                --repo "${REPO}" \
                --number "${n}" \
                --state closed \
                > /dev/null 2>&1; then
                echo "✓ 已关闭 #${n}"
              else
                echo "⚠️ 关闭 #${n} 失败"
                failed=$((failed + 1))
              fi
            done

            if [ "${failed}" -gt 0 ]; then
              echo "⚠️ 有 ${failed} 条公告关闭失败，请手工处理"
            fi
