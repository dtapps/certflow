# CNB Issue 模板：缺陷反馈
name: 缺陷反馈
description: 报告 CertFlow 的异常、崩溃或行为不符合预期
title: '[缺陷] '
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 Issue，避免重复；不要在 Issue 中粘贴 Token、私钥、证书内容或真实域名等敏感信息。
        安全问题请通过 SECURITY.md 中的私下渠道报告。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么问题？请尽量给出可复现的说明。
      placeholder: |
        操作步骤：
        1. ...
        2. ...

        实际结果：...
        预期结果：...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CertFlow 版本
      description: 在「设置 → 关于」中查看；nightly 请填写完整版本号。
      placeholder: v1.2.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: 系统架构
      placeholder: Apple Silicon / Intel / x86_64 / ARM64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 提供可帮助定位问题的日志、截图或录屏；敏感信息请先脱敏。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交检查
      options:
        - label: 我已搜索已有 Issue，且未发现同一问题
          required: true
        - label: 我已移除日志、截图和附件中的敏感信息
          required: true
