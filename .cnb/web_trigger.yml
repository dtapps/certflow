branch:
  - reg: ^master
    buttons:
      - name: 发布 Release
        description: 从 GitHub 下载 release 构建产物并发布到 CNB。预发布看版本号后缀（1.0.0-rc.1 / -beta.1 / -alpha.1 / -nightly.1；滚动预发布填 nightly），无后缀即正式版
        event: web_trigger_release
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            # 预发布与否由版本号后缀决定（见 scripts/ci/resolve-prerelease.sh），
            # 不再单独提供「预发布」开关：布尔输入会和版本号打架。
            name: 版本号
            description: 例如 1.0.0（正式版）、1.0.0-rc.1（预发布）、nightly（滚动预发布）
            required: true
            type: input
