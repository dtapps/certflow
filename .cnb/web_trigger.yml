branch:
  - buttons:
      - name: 发布 Release
        description: 从 GitHub 下载 release 构建产物并发布到 CNB
        event: web_trigger_release
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            description: 请输入版本号（例如 1.0.0）
            required: true
            type: input
      - name: 发布 Nightly
        description: 从 GitHub 下载 nightly 构建产物并发布到 CNB（预发布）
        event: web_trigger_nightly
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          overlying:
            name: 发布模式
            description: 发布模式：叠加=更新已存在的 Release；重建=删除后重新创建（首次发布请选重建）
            type: select
            required: false
            default: "true"
            options:
              - name: 更新已有 Release（叠加）
                value: "true"
              - name: 删除后重建
                value: "false"
