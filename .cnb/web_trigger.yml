branch:
  - reg: ^master
    buttons:
      - name: 发布 Release
        description: 从 GitHub 下载 release 构建产物并发布到 CNB。预发布看版本号后缀（1.0.0-rc.1 / -beta.1 / -alpha.1 / -nightly.20260101；也可填 nightly
          自动展开为带日期的版本），无后缀即正式版
        event: web_trigger_release
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          version:
            name: 打包版本
            description: 请输入打包版本，如 v1.2.3；预发布版本请带 rc/beta/alpha/nightly 后缀，如 v1.2.3-rc.1、v1.2.3-nightly.20260101（填 nightly
              自动推导当天夜间构建版本）
            required: true # 是否必填
            type: input
          commit:
            name: 构建提交
            description: 可选：要发布的代码版本（完整 SHA / 分支 / tag）；留空则用当前分支 HEAD
            required: false
            type: input

      - name: 生成 Code Wiki
        description: 重新分析仓库并生成 Code Wiki 文档
        event: web_trigger_codewiki # 触发的 CI 事件名
        permissions:
          roles:
            - owner
            - master
            - developer

