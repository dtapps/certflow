minimumReleaseAgeExclude:
  - '@vitejs/plugin-vue@6.0.8'

# 用 typescript-native-bridge (TNB) 把 typescript 替换为 TS7 (tsgo) Go 引擎，
# 保留经典 typescript API 表面，vue-tsc / typescript-eslint 无需改版本即可获得加速。
# 版本须写死（预发布版 caret 无法匹配）。macOS arm64 官方支持。
# 安全修复 GHSA-g3hv-75wg-m249 / CVE-2026-118764
# minimatch < 11.0.1 在 optimizationLevel>=2 下存在 globparts 放大导致的 DoS
# （**/../ 克隆条目 + 二阶两两比较 -> 二次复杂度）。
# 10.x 无修复版本（10.2.6 已是 10.x 末版），只能 >= 11.0.1。
# glob@13 的内联产物里带着 minimatch 10 的漏洞代码，故一并抬到 glob@14（内联已修复版本）。
overrides:
  # TNB 用 TS7 引擎（tsgo）；版本写死以避免与 CI frozen-lockfile 冲突，升级时手动 bump 版本号
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
  # 修复 CVE-2021-3807 (ansi-regex 4.1.0/5.0.0 低效正则复杂度漏洞)，升级到推荐修复版本 6.0.1
  ansi-regex: 6.0.1
  minimatch: 11.0.5
  glob: 14.0.4
  zod: 4.6.6

