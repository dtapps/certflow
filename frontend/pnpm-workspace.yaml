minimumReleaseAgeExclude:
  - '@vitejs/plugin-vue@6.0.8'

# 用 typescript-native-bridge (TNB) 把 typescript 替换为 TS7 (tsgo) Go 引擎，
# 保留经典 typescript API 表面，vue-tsc / typescript-eslint 无需改版本即可获得加速。
# 版本须写死（预发布版 caret 无法匹配）。macOS arm64 官方支持。
# 安全修复 GHSA-g3hv-75wg-m249 / CVE-2026-118764
# minimatch < 11.0.1 在 optimizationLevel>=2 下存在 globparts 放大导致的 DoS
# （**/../ 克隆条目 + 二阶两两比较 -> 二次复杂度）。
# 10.x 无修复版本（10.2.6 已是 10.x 末版），只能 >= 11.0.1。
# glob@13 的内联产物里带着 minimatch 10 的漏洞代码，故一并抬到 glob@14（内联已修复版本）。
overrides:
  # TNB 用 TS7 引擎（tsgo）；版本写死以避免与 CI frozen-lockfile 冲突，升级时手动 bump 版本号
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
  # 修复 CVE-2021-3807 (ansi-regex 4.1.0/5.0.0 低效正则复杂度漏洞)，升级到推荐修复版本 6.0.1
  ansi-regex: 6.0.1
  minimatch: 11.0.5
  glob: 14.0.4
  zod: 4.6.6

# 已确认「上游无修复版本」的高危漏洞容忍清单（只接受 GHSA ID，CVE 号写在这里无效）。
# 命中项不会让 pnpm audit 失败，但仍会在输出里单独列出：`N ignored: 1 high`。
audit:
  ignore:
    # GHSA-fc5q-39xc-vjpf（CVE-2026-112366）：picomatch <= 4.0.7 单分支重复 extglob 造成的 ReDoS。
    # 现状（2026-11 核查）：上游最新版即 4.0.7（2026-08-24 发布），公告 first_patched_version = None，
    # 修复 PR micromatch/picomatch#194 仍 open，因此 overrides / 升级都无法消除，只能等待 4.0.8+。
    # 影响面：picomatch 仅被 vue-router 的 unplugin 构建期入口（dist/unplugin-*.mjs）引用；
    # 本项目未使用 vue-router 的文件路由插件（vite.config.ts 只用了 unplugin-auto-import / unplugin-vue-components），
    # 该路径不可达，且构建产物（internal/webui/www）中不含 picomatch；glob 模式全部由本仓库硬编码，无可控输入。
    # 复查方式：picomatch 发版后 `pnpm update picomatch` → `pnpm audit --production --audit-level high`
    #          → 若不再报 GHSA-fc5q-39xc-vjpf 即删除本条目。
    - GHSA-fc5q-39xc-vjpf

