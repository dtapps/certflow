include:
  - .cnb/workflows/cnb-sechook.yml
  - .cnb/workflows/code-review.yml
  - .cnb/workflows/code-security-config.yml
  - .cnb/workflows/codewiki.yml
  - .cnb/workflows/knowledge-base.yml
  - .cnb/workflows/pull-coverage.yml
  - .cnb/workflows/push-coverage.yml
  - .cnb/workflows/push.yml
  - .cnb/workflows/sca.yml

# 发布 Release（从 GitHub 下载 release 构建产物并发布到 CNB）
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，与 GitHub 的 release.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 定时任务的默认值（手动填也可）：不是版本号，自动推导成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>，
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#
# 「是不是预发布」只看版本号后缀，不再接受页面上的 pre_release 勾选：
# 布尔输入会和版本号打架（此前 UI 勾了预发布但版本号是 1.0.0，就会发出一个
# prerelease=true 却挂着正式版本号的 Release）。
# CERTFLOW_GITHUB_TOKEN 去 envs 里配置环境变量
.trigger_release: &trigger_release
  runner:
    tags: cnb:arch:amd64
  imports: https://cnb.cool/dtapp/envs/-/blob/main/github.yml # 导入外部环境变量/配置
  stages:
    - name: 处理版本号与选项
      script: |
        # 版本号归一化 / 格式校验 / 预发布判定只有一份实现：scripts/ci/resolve-prerelease.sh，
        # GitHub 的 .github/workflows/release.yml 也 source 它，避免两边各写一套 grep 正则、
        # 口径慢慢跑偏。
        #
        # 「是不是预发布」只看版本号后缀（rc / beta / alpha / nightly），不接受人工勾选：
        # 布尔输入会和版本号打架（此前 pre_release 与 version 就是两套口径）。
        # shellcheck source=scripts/ci/resolve-prerelease.sh
        . scripts/ci/resolve-prerelease.sh
        resolve_version "$version" || exit 1
        echo "$PRE_NOTE"

        # 通过 set-output 输出到 result，由下方 exports 映射成后续 stage 的环境变量。
        echo "##[set-output interior_version=$TAG]"
        echo "##[set-output interior_prerelease=$PRERELEASE]"
      exports:
        interior_version: INTERIOR_VERSION
        interior_prerelease: INTERIOR_PRERELEASE

    # 生成 Release 选项文件，供 git:release 的 optionsFrom 读取。
    #
    # 为什么不用 options 里的 ${INTERIOR_PRERELEASE} 直接插值：preRelease 的类型是严格的
    # Boolean，而变量替换产出的是字符串 "false"，字符串在布尔位置上容易被当成真值，
    # 导致正式版也被勾成预发布。走 optionsFrom 读到的是 JSON 里真正的布尔值，没有这个歧义。
    # descriptionFromFile 同理：正文里有反引号、管道符和换行，塞进插值里容易被转义毁掉。
    - name: 生成 Release 选项文件
      script: |
        set -eu
        # 空值写进配置后 git:release 会当成脏配置，报错还落在「发布」那一步，跟真正的原因隔了三屏。
        # 空就直接死在这一步。
        : "${INTERIOR_VERSION:?INTERIOR_VERSION 为空——第一步没跑成功}"
        : "${INTERIOR_PRERELEASE:?INTERIOR_PRERELEASE 为空——第一步没跑成功}"

        # 标题统一带项目名前缀（与 GitHub 的 .github/workflows/release.yml 同口径，改名字两边一起改）
        project_name="CertFlow"

        if [ "${INTERIOR_PRERELEASE}" = "true" ]; then
          release_title="${project_name} ${INTERIOR_VERSION} (预发布)"
          prerelease_json=true
        else
          release_title="${project_name} ${INTERIOR_VERSION}"
          prerelease_json=false
        fi

        printf '{\n  "tag": "%s",\n  "title": "%s",\n  "descriptionFromFile": "release_body.md",\n  "preRelease": %s\n}\n' \
          "${INTERIOR_VERSION}" "${release_title}" "${prerelease_json}" > ./.cnb-release-options.json
        cat ./.cnb-release-options.json

    - name: 从 GitHub Release 下载构建产物
      script: |
        TAG="${INTERIOR_VERSION}"
        GITHUB_API="https://api.github.com/repos/dtapps/certflow"
        DOWNLOAD_DIR="dist"
        mkdir -p "${DOWNLOAD_DIR}"

        # 带重试的 curl（最多 3 次，间隔 5 秒）
        curl_retry() {
          local max=3 i=1
          while [ $i -le $max ]; do
            if output=$("$@" 2>&1); then
              echo "$output"
              return 0
            fi
            echo "  ⚠ 第 ${i}/${max} 次失败，5 秒后重试..."
            sleep 5
            i=$((i + 1))
          done
          echo "  ✗ 重试 ${max} 次后仍然失败"
          echo "$output"
          return 1
        }

        HTTP_CODE=$(curl_retry curl -s -o /dev/null -w "%{http_code}" \
          -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
          "${GITHUB_API}/releases/tags/${TAG}")

        if [ "$HTTP_CODE" != "200" ]; then
          echo "错误：GitHub 上未找到 ${TAG} 的 Release（HTTP ${HTTP_CODE}）"
          exit 1
        fi
        echo "✓ 找到 GitHub Release: ${TAG}"

        RELEASE_INFO=$(curl_retry curl -s \
          -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
          "${GITHUB_API}/releases/tags/${TAG}")
        ASSET_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
        echo "共 ${ASSET_COUNT} 个附件"

        # 保存 Release 信息，供后续替换下载链接生成发布内容使用
        echo "$RELEASE_INFO" > release_info.json

        if [ "$ASSET_COUNT" = "0" ]; then
          echo "错误：Release 没有附件，请先在 GitHub Actions 完成构建"
          exit 1
        fi

        for i in $(seq 0 $((ASSET_COUNT - 1))); do
          ASSET_NAME=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].name")
          ASSET_URL=$(echo "$RELEASE_INFO" | jq -r ".assets[$i].browser_download_url")
          echo "下载 ${ASSET_NAME}..."
          curl_retry curl -sL \
            -H "Authorization: token ${CERTFLOW_GITHUB_TOKEN}" \
            -o "${DOWNLOAD_DIR}/${ASSET_NAME}" "${ASSET_URL}"
          echo "  ✓ 完成"
        done

        echo ""
        echo "下载完成："
        ls -lh "${DOWNLOAD_DIR}/"

    # 生成发布内容（直接复用 GitHub Release 正文，下载链接替换为 CNB）
    - name: 生成发布内容
      script: |
        # 复用 GitHub Release 的完整正文（含其原有下载表格），
        # 把所有指向该仓库的 GitHub 链接（下载/标签/仓库页）统一替换为 CNB，
        # 避免单独生成表格导致与 GitHub 不同步。CNB 仓库路径为 dtapp/certflow
        # 且带 /-/ 前缀，故替换仓库根而非仅下载前缀，避免漏掉如
        # 「如需稳定版本，请使用 正式发布」这类指向 releases 发布页的链接。
        GH_BASE="https://github.com/dtapps/certflow"
        CNB_BASE="${CNB_REPO_URL_HTTPS%/}/-"
        RELEASE_INFO=$(cat release_info.json)
        echo "$RELEASE_INFO" | jq -r '.body // ""' \
          | sed "s#${GH_BASE}#${CNB_BASE}#g" \
          > release_body.md

        cat release_body.md

    # 删除已存在的 Release 与 Tag，再重建，避免旧附件堆积。
    # 两步均调用 CNB Open API，CNB_TOKEN 需 repo-release:rw 权限，
    # CNB_API_ENDPOINT 由流水线自动注入。注意：DeleteTag 不会自动删 Release，
    # DeleteRelease 也不会自动删 Tag，所以两个对象必须分别删除。
    - name: 删除已存在的 Release 与 Tag
      shell: true
      script: |
        set -e
        API="${CNB_API_ENDPOINT%/}"
        REPO="$CNB_REPO_SLUG"
        TAG="${INTERIOR_VERSION}"

        # ---- 第 1 步：删除 Release（发行版） ----
        # 查询：GET /-/releases/tags/{tag}  → 200 存在 / 404 不存在
        echo "查询是否已存在 release (tag=$TAG) ..."
        HTTP=$(curl -s -o /tmp/nr.json -w "%{http_code}" \
          -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/releases/tags/$TAG")
        if [ "$HTTP" = "200" ]; then
          ID=$(jq -r '.id // .release_id // empty' /tmp/nr.json)
          echo "release 已存在 (id=$ID)，删除后重新发布"
          # 删除：DELETE /-/releases/{id}  → 成功返回 204/200
          DEL=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            "$API/$REPO/-/releases/$ID")
          if [ "$DEL" = "204" ] || [ "$DEL" = "200" ]; then
            echo "已删除旧 release"
          else
            echo "删除 release 失败 HTTP=$DEL"; exit 1
          fi
        elif [ "$HTTP" = "404" ]; then
          echo "release 不存在，直接发布"
        else
          echo "查询 release 失败 HTTP=$HTTP"; cat /tmp/nr.json; exit 1
        fi

        # ---- 第 2 步：删除 Git Tag（标签） ----
        # 删除：DELETE /-/tags/{repo}/{tag}  → 204 成功 / 404 不存在
        # 该接口仅删 tag，不删关联 Release，故需在第 1 步之外单独删除。
        echo "删除同名 tag (tag=$TAG) ..."
        TAG_HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
          -X DELETE \
          -H "Authorization: Bearer $CNB_TOKEN" \
          -H "Accept: application/vnd.cnb.api+json" \
          "$API/$REPO/-/tags/$TAG")
        if [ "$TAG_HTTP" = "204" ] || [ "$TAG_HTTP" = "200" ]; then
          echo "已删除旧 tag"
        elif [ "$TAG_HTTP" = "404" ]; then
          echo "tag 不存在，跳过"
        else
          # 删 tag 失败不阻断发布（后续 git:release 会在已有 tag 上重建）
          echo "删除 tag 失败 HTTP=$TAG_HTTP（继续发布）"
        fi

    # https://docs.cnb.cool/zh/build/internal-steps.html#git-release
    - name: 创建 Release
      type: git:release
      # tag / title / preRelease / description 全部来自上一步写出的 JSON。
      # 版本号带 -rc / -beta / -alpha / -nightly 后缀才勾选「预发布」，正式版不勾，
      # 不接受人工输入。overlying 默认 false（先删再建），与上方「删除已存在的 Release 与 Tag」一致。
      optionsFrom: ./.cnb-release-options.json

    # https://docs.cnb.cool/zh/plugin/public/cnbcool/attachments.html
    - name: 上传 Release 附件
      image: cnbcool/attachments:latest
      settings:
        type: UPLOAD
        tag: ${INTERIOR_VERSION}
        attachments:
          - 'dist/*'
      exports:
        FILES: FILES

    - name: 输出 Release 附件
      script: echo $FILES

master:
  # 手动触发：通过页面自定义按钮执行（预发布看版本号后缀，页面不再有勾选框）
  web_trigger_release:
    - *trigger_release

  # API 触发：由 GitHub Actions 发布 Release 后调用 CNB Open API 触发（event=api_trigger_release）
  # 需通过 env 传入 version 变量（如 {"version":"v1.2.3"} / {"version":"v1.2.3-rc.1"} / {"version":"v1.2.4-nightly.20260101"}）。
  # 预发布标记由 version 后缀推导，env 里的 pre_release 已废弃（传了也不看，避免两套口径打架）。
  api_trigger_release:
    - *trigger_release
