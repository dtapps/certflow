# 从 CNB / GitHub Release 下载产物并发布到 Gitee Release
#
# 附件只认一个源，由 DOWNLOAD_SOURCE 决定（cnb 默认 / github），绝不混用：
# 包里注入了 RepoSource，客户端据此选择升级通道；同一次发布里混两个来源，
# 等于给用户随机分配升级通道。cnb 源附件名固定、大小向 CNB 现问、正文本地生成，
# 全程不碰 GitHub API（CNB API 匿名 401）；github 源才读 GitHub Release 元数据。
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，与 GitHub 的 release.yml / CNB 的 .cnb.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 不是版本号本身，会自动展开成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>：
#                               定时任务（每天 UTC 00:00）用它；手动执行填 nightly
#                               同样会展开（基版本取最近正式版，日期取执行当天的 UTC 日期）。
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#
# 注意：裸 nightly 只能由 GitHub 侧展开（定时任务或手动执行填 nightly 都一样），
# 本镜像端只接收**最终 tag**（如 v1.2.4-nightly.20260101），
# 传裸 nightly 直接报错（拼不出真实 tag，只能 404）。
#
# 实现拆成两个脚本（都在 scripts/ci/，可本地单独跑）：
#   1) gitee-release-download.js —— 按跳过规则下载产物到 assets/，写出清单 gitee-release.json
#      （清单里含 tag / 预发布 / 正文 HTML / 待上传文件列表）
#   2) gitee-release-publish.js  —— 读清单，建 Release 并逐个上传附件
#
# 为什么不用 release@gitee 插件：
#   - assertFiles 是静态清单，做不到「某个文件超 100MB 就跳过它」；
#   - 400 时响应体为空，看不到 Gitee 到底说了什么；
#   - 正文走 KEY=VALUE 参数：不能换行、不能有裸 =、整值会被当相对路径 open（>4096 字节直接崩）。
#
# 触发方式：
#   1) GitHub Actions 发完 Release 后 POST Webhook（event=certflow-release）；
#   2) Gitee → 仓库 → 流水线 → 「发布版本」→ 执行（补发历史版本时手填 VERSION）。
#
# 前置条件（Gitee 流水线 → 设置 → 全局参数）：
#   - DOWNLOAD_SOURCE       可选，cnb（默认）/ github。只认一个源、不跨平台混用，
#                           理由见本文件开头；其它取值直接报错，不会静默退回默认源。
#   - VERSION               可选，带不带 v 都行；留空时先跑 --resolve-tag 查所选源的最新 tag，
#                           github 源走 GitHub API；cnb 源匿名 401 查不到，需手填 VERSION。
#   - COMMIT                可选，GitHub 侧同步时带过来的提交号；配了本流水线就会
#                           切到那个 commit（跑发布那一版的脚本），没配则用分支头
#   - CERTFLOW_GITHUB_TOKEN 可选，GitHub 只读令牌，避开 api.github.com 匿名限流
#   - CERTFLOW_GITEE_TOKEN  必填，Gitee 个人令牌（repo 读写）
#
# 参数名不能以 GITEE_ 开头：该前缀由 Gitee 流水线自己占用（GITEE_PARAMS 等），
# 自定义参数用 GITEE_xxx 会被平台拒绝或覆盖，所以统一加 CERTFLOW_ 前缀。
#
# 预发布没有开关：VERSION 空时先用 --resolve-tag 补出 tag，再 source resolve-prerelease.sh，
# 只看版本号后缀（rc/beta/alpha/nightly）判定，与 GitHub / CNB 两侧同口径。
version: '1.0'
name: release
displayName: 发布版本

triggers:
  # 只认 Webhook 自定义事件：本仓库是 GitHub 的镜像，配 push 会每次同步都发一版。
  trigger: auto
  webhook:
    - 'certflow-release'

# 同一条流水线同时只跑一个：建 Release / 传附件 / 覆盖同名 tag 并发会互相踩。
strategy:
  blocking: true

# 引用仓库级「全局参数」；缺了这段脚本拿到的就是空值。
ref_variable:
  - DOWNLOAD_SOURCE
  - VERSION
  - COMMIT
  - CERTFLOW_GITHUB_TOKEN
  - CERTFLOW_GITEE_TOKEN

stages:
  - name: publish
    displayName: 下载并发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: publish_release
        displayName: 下载 CNB / GitHub 资产并发布到 Gitee
        nodeVersion: 20.19.0
        commands:
          - |
            set -eu
            # 平台做的是**文本插值**，不是 shell 展开：必须写 ${VERSION} 的精确形式，
            # 写成 ${VERSION:-} 不匹配插值规则，会原样落进 shell。
            set +u
            export RAW_VERSION="${VERSION}"
            export SOURCE_INPUT="${DOWNLOAD_SOURCE}"
            export CERTFLOW_GITHUB_TOKEN="${CERTFLOW_GITHUB_TOKEN}"
            export CERTFLOW_GITEE_TOKEN="${CERTFLOW_GITEE_TOKEN}"
            # 本次发布对应的 commit：GitHub 侧同步时通过 webhook 的 params 一起传过来
            # （对应全局参数 COMMIT，可选）。用途是让本流水线跑**发布那一版**的脚本
            # （scripts/ci/gitee-release-*.js），而不是镜像仓库分支头的最新版。
            export RELEASE_COMMIT="${COMMIT}"
            set -u
            # 全局参数没配时平台插值会把 ${XXX} 原样留下，统一清成空串。
            case "${RELEASE_COMMIT}" in
              '${'*) RELEASE_COMMIT="" ;;
            esac
            case "${SOURCE_INPUT}" in
              '${'*) SOURCE_INPUT="" ;;
            esac
            case "${RAW_VERSION}" in
              '${'*) RAW_VERSION="" ;;
            esac

            # 下载源只允许一个：cnb|github 原样、空按 cnb、其它直接报错。
            # 严禁某源抽风时临时回退到另一个源 —— 包里注入的 RepoSource 决定升级通道，
            # 一次发布混两个来源等于随机分配通道。
            case "${SOURCE_INPUT}" in
              cnb | github) SOURCE="${SOURCE_INPUT}" ;;
              "") SOURCE=cnb ;;
              *) echo "错误：DOWNLOAD_SOURCE 只能是 cnb 或 github，收到 '${SOURCE_INPUT}'"; exit 1 ;;
            esac
            export DOWNLOAD_SOURCE="${SOURCE}"
            echo "下载源: ${SOURCE}（整条链只用这一个源）"

            # VERSION 为空先跑脚本 --resolve-tag 查最新 tag（只打印 tag，不下载）。
            # github 源走 GitHub API；cnb 源匿名 401 查不到，脚本会报错让你填 VERSION。
            # 必须在下载前定下来：正文横幅与下游 tagName 都依赖它。
            if [ -z "${RAW_VERSION}" ]; then
              echo "VERSION 为空：按 ${SOURCE} 查最新 Release 的 tag"
              RAW_VERSION="$(node scripts/ci/gitee-release-download.js --resolve-tag)"
            fi
            # 镜像端只收最终 tag：裸 nightly 的基版本/日期必须由 GitHub 侧展开，
            # 这里 git tag 历史不全，交给 resolve_version 展开会得到与上游不同的 tag。
            case "${RAW_VERSION}" in
              nightly | NIGHTLY)
                echo "错误：请填最终 nightly tag（如 v1.2.4-nightly.20260101），不要传裸 nightly"; exit 1 ;;
            esac
            export RELEASE_VERSION="${RAW_VERSION}"

            # 预发布只看版本号后缀（rc/beta/alpha/nightly），规则只有一份实现。
            # source 只带进函数，必须显式调用。
            # shellcheck disable=SC1091
            . scripts/ci/resolve-prerelease.sh
            resolve_version "${RELEASE_VERSION}" || exit 1
            export RELEASE_VERSION="${TAG}" PRERELEASE="${PRERELEASE}"
            echo "${PRE_NOTE}"

            if [ -z "$CERTFLOW_GITEE_TOKEN" ]; then
              echo "错误：未配置全局参数 CERTFLOW_GITEE_TOKEN（个人令牌，repo 读写）"
              exit 1
            fi

            # 双触发去重：Gitee 现在由 GitHub 与 CNB 两边触发（一个源 github、一个源 cnb），
            # 只要有一边发布成功即可。下载前先查目标 tag 的 Gitee Release 是否已存在：
            # 存在 → 本次整段跳过（exit 0），不再下载、不重建 Release（重建会删掉先到者的附件）。
            # 本流水线 strategy.blocking: true，两个触发串行执行：后到者开始前先到者已跑完
            # （含附件上传），所以这里查到 Release 存在时附件必定齐全，不存在竞态。
            # 注意 Gitee 的 GET /releases/tags/{tag} 在「没有这个 Release」时返回 200 + body null，
            # 不是 404，所以必须解析 body、看有没有非空对象（有 id），不能只看 HTTP 状态。
            # 查不到 / 查询出错时一律「继续发布」：宁可稍后 publish 幂等重建，也不漏发。
            GITEE_API="https://gitee.com/api/v5/repos/dtapps/certflow"
            EXIST_BODY=$(curl -sS --max-time 20 -w '\n%{http_code}' \
              "${GITEE_API}/releases/tags/${RELEASE_VERSION}?access_token=${CERTFLOW_GITEE_TOKEN}" \
              2>/dev/null || true)
            EXIST_HTTP="${EXIST_BODY##*$'\n'}"
            EXIST_JSON="${EXIST_BODY%$'\n'*}"
            if [ "$EXIST_HTTP" = "200" ]; then
              # body 是 JSON 对象且有 id → Release 已存在；body 为 null → 还没发过
              EXIST_ID=$(printf '%s' "${EXIST_JSON:-null}" |
                node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const o=JSON.parse(s);process.stdout.write(o&&o.id?String(o.id):"")}catch(e){}})')
              if [ -n "$EXIST_ID" ]; then
                echo "✓ Gitee 上 ${RELEASE_VERSION} 的 Release 已存在（id=${EXIST_ID}，另一触发源已发布），跳过本次下载与发布"
                exit 0
              fi
              echo "Gitee 上 ${RELEASE_VERSION} 的 Release 尚不存在，继续发布"
            else
              echo "⚠ 查询 Gitee Release 状态异常（HTTP ${EXIST_HTTP:-无响应}），按未发布处理，继续发布"
            fi

            # 切到发布对应的 commit：只从**本仓库自己的 origin**取（不跨平台去 GitHub 拉）——
            # 本仓库是权威源，commit 迟早会同步过来；还没到就沿用分支头，不阻断同步。
            if [ -n "$RELEASE_COMMIT" ]; then
              echo "检出发布对应的 commit: $RELEASE_COMMIT"
              if git rev-parse --verify -q "${RELEASE_COMMIT}^{commit}" >/dev/null 2>&1; then
                git checkout -q "$RELEASE_COMMIT" && echo "✓ 工作区已有该 commit，直接切过去"
              elif git fetch --depth 1 origin "$RELEASE_COMMIT" >/dev/null 2>&1 &&
                git checkout -q FETCH_HEAD; then
                echo "✓ 已从 origin 检出该 commit"
              else
                echo "⚠ 本仓库还没有该 commit（同步还没到），继续用分支头"
              fi
            else
              echo "未提供 commit，沿用分支头"
            fi

            # 正文 markdown → HTML 用 marked（Gitee 前端是 markdown-it({html:true})，
            # HTML 结构最稳；纯 markdown 的管道表格要靠 gfm 插件，不确定开没开）。
            export npm_config_registry=https://registry.npmmirror.com
            npm install marked \
              --registry=https://registry.npmmirror.com --no-audit --no-fund --loglevel=error

            echo "======== 1/2 下载（来源 ${DOWNLOAD_SOURCE}，只跳过单文件 >100MB 的附件）========"
            node scripts/ci/gitee-release-download.js

            echo "======== 2/2 发布（建 Release + 逐个上传）========"
            node scripts/ci/gitee-release-publish.js
