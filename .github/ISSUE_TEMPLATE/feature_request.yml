name: 功能建议
description: 提出新功能、体验改进或工作流优化建议
title: '[Feature] '
body:
  - type: markdown
    attributes:
      value: |
        提交前请搜索已有 Issue，避免重复；请不要在建议中粘贴 Token、私钥或真实域名等敏感信息。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有哪些不便或限制？在什么场景下会遇到？
      placeholder: 在使用 CertFlow 完成某项任务时，目前需要……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望增加或改进什么功能？建议描述关键交互与预期结果。
      placeholder: |
        建议新增/调整：...
        使用流程：...
        预期结果：...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 可选。是否尝试过其他方案，或希望保留现有行为？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选。提供使用场景、截图、相关 Issue 或参考资料。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交检查
      options:
        - label: 我已搜索已有 Issue，且未发现同一建议
          required: true
        - label: 我提供的信息不包含敏感数据
          required: true
