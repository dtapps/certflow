# 每日构建工作流
# 每天 00:00 UTC 自动构建 nightly 版本并发布为 Pre-release
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
  CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
  # Windows Authenticode 签名所需的证书（未配置对应 secret 时签名步骤自动跳过）
  SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
  SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
  SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
  TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}

jobs:
  # 统一生成版本号与构建参数（BUILD_TIME 等），确保「所有平台注入的 build_time」
  # 与「SHA256SUMS 写入的 build_time」一致，供客户端 nightly 时间对比对齐。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_time: ${{ steps.version.outputs.build_time }}
      git_commit: ${{ steps.version.outputs.git_commit }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 生成版本号
        id: version
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            BASE_VERSION="0.1.0"
          else
            BASE_VERSION="${PREV_TAG#v}"
          fi
          VERSION="${BASE_VERSION}-nightly"
          BUILD_TIME=$(bash scripts/get-build-time.sh)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "Nightly 版本号: ${VERSION}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
          - os: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      # 检出代码（fetch-depth: 0 确保能读取所有 tag）
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 打印构建参数（版本号/BUILD_TIME 由 prepare job 统一生成）
      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ needs.prepare.outputs.build_time }}"
          echo "VERSION=${{ needs.prepare.outputs.version }}"
          echo "GIT_COMMIT=${{ needs.prepare.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      # 缓存 apt 已下载的 .deb 包，避免每次 apt-get install 重新从源拉取
      # libgtk-4-dev / libwebkitgtk-6.0-dev 等大依赖（ubuntu runner 有效）。
      - name: 缓存 apt 包
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / wails3 go install
      # 命中已下载的模块，避免重复从 proxy 拉取。
      - name: 缓存 Go module 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build），避免每次全量重编。
      # GOCACHE 跨平台路径不同，用 go env 动态取。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.GOCACHE }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 下载 Go 依赖
        run: go mod download

      # 缓存 wails3 CLI 二进制（go install 每次从源码编译很慢）。
      # 命中缓存则跳过安装；key 含 go.mod 哈希，wails3 版本随依赖变化时自动失效。
      - name: 缓存 wails3 二进制
        id: cache-wails3
        uses: actions/cache@v4
        with:
          path: ${{ env.GOBIN }}/wails3${{ runner.os == 'Windows' && '.exe' || '' }}
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}

      - name: 安装 Wails3
        if: steps.cache-wails3.outputs.cache-hit != 'true'
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      # 用 setup-node 的 cache 直接缓存 frontend/node_modules（按 lockfile hash），
      # 比 pnpm/action-setup 的 cache:true（仅缓存 pnpm store）更快，pnpm install 命中后秒过。
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      - name: 检查构建环境
        run: wails3 doctor

      # 缓存 Chocolatey 已装包（nsis 每次从网络下载很慢）。
      # 命中后下方 choco install 会自动 detect 已安装并跳过下载；写 PATH 的步骤仍需执行。
      - name: 缓存 Chocolatey 包
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib
            C:\ProgramData\chocolatey\bin
          key: choco-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            choco-${{ runner.os }}-

      - name: 安装 NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          echo $nsisPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # 构建和打包（BUILD_TIME/VERSION 由 prepare job 统一生成，各平台一致）
      - name: 构建
        shell: bash
        run: wails3 task build BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN

      - name: 打包
        shell: bash
        run: wails3 task package BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN

      # macOS: 签名 + 公证（解决 Gatekeeper 在系统升级后阻止 App 的问题）
      - name: macOS 签名与公证
        if: runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE != ''
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZER_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARIZER_KEYCHAIN_PROFILE }}
        shell: bash
        run: wails3 task darwin:sign:notarize

      # Windows: 将 base64 编码的证书 secret 解码为本地 .pfx 文件
      # WINDOWS_SIGN_CERTIFICATE 中存放的是 .pfx 的 base64（含私钥，禁止入库，仅作 secret）
      - name: 解码 Windows 签名证书
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE != ''
        shell: bash
        run: |
          PFX="$RUNNER_TEMP/certflow_authenticode.pfx"
          if echo "$SIGN_CERTIFICATE" | base64 -d > "$PFX" 2>/dev/null; then
            echo "解码为 .pfx 文件: $PFX"
          else
            # secret 本身就是路径（证书已预置在 runner 上）
            PFX="$SIGN_CERTIFICATE"
            echo "使用证书路径: $PFX"
          fi
          echo "SIGN_CERTIFICATE=$PFX" >> "$GITHUB_ENV"

      # Windows: 先签名安装包（-install.exe，用户实际下载的文件，修复 SmartScreen 拦截）
      # windows:sign:installer 内部会重新生成 installer 并签名外层 exe
      - name: Windows 安装包签名
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE != ''
        env:
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign:installer

      # Windows: 再签名独立 exe（供自更新 updater-*.zip 使用，保证替换后的二进制已签名）
      - name: Windows 可执行文件签名
        if: runner.os == 'Windows' && env.SIGN_CERTIFICATE != ''
        env:
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign

      - name: 重命名产物
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip。
          # - CertFlow-...-darwin-...zip：打包文件，显示于下载表格（首次安装用）
          # - updater-CertFlow-...-darwin-...zip：升级文件（隐藏）。
          # wails 文档要求 macOS 自更新替换整个 .app 目录以保留 Gatekeeper
          # 签名，故升级文件必须是 .app 归档，不能只压裸二进制。
          if [ -d "certflow.app" ]; then
            zip -r "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" certflow.app
            cp "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 升级专用文件（updater- 前缀，不在下载表格显示）
          # Windows 的 git-bash 不带 zip 命令，改用 PowerShell 内置的 Compress-Archive
          if [ -f "certflow.exe" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -Command "Compress-Archive -Path 'certflow.exe' -DestinationPath 'updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip' -Force"
            else
              zip "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" certflow.exe
            fi
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi
          # Windows: 安装包（打包文件，显示在下载表格）
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv CertFlow-*-install.exe renamed/
          fi

          # Linux: 升级专用文件（updater- 前缀，不在下载表格显示）
          # 用 $PLATFORM 守卫，避免 macOS/Windows 上残留的裸二进制 certflow 被误判为
          # Linux 产物（每个 matrix job 只构建一个平台）。macOS 升级文件必须是 .app 归档
          # （见上方 223 行分支），绝不能把裸二进制打成 tar.gz 当升级包，否则自更新会
          # 用裸二进制替换 .app 目录，导致「无法打开应用程序」。
          if [ "$PLATFORM" = "linux" ] && [ -f "certflow" ]; then
            tar -czf "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" certflow
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" renamed/
          fi
          # Linux: 各格式安装包（打包文件，显示在下载表格）
          for f in *.AppImage; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.AppImage" && mv CertFlow-*.AppImage renamed/
          done
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.deb" && mv CertFlow-*.deb renamed/
          done
          for f in *.rpm; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.rpm" && mv CertFlow-*.rpm renamed/
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.pkg.tar.zst" && mv CertFlow-*.pkg.tar.zst renamed/
          done

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: certflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 3

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: [build, prepare]
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: certflow-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          rm -f SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          # 写入构建时间（与注入二进制的 BUILD_TIME 完全一致，RFC3339, UTC），
          # 供客户端对比「远端 SHA256SUMS 的 build_time」与「本机已装二进制 build_time」。
          echo "# build_time=${{ needs.prepare.outputs.build_time }}" >> SHA256SUMS
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 生成发布说明
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # 获取上一个稳定版本
          PREV_STABLE_TAG=$(git tag --sort=-v:refname | grep -v nightly | head -1)
          if [ -z "$PREV_STABLE_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_STABLE_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          # 生成下载表格
          echo "## ⚠️ Nightly 构建" > release_body.md
          echo "" >> release_body.md
          echo "> 这是每日自动构建的预发布版本，可能包含未测试的功能。" >> release_body.md
          echo "> 如需稳定版本，请使用 [正式发布](https://github.com/${REPO}/releases)。" >> release_body.md
          echo "" >> release_body.md
          echo "**版本**: \`${VERSION}\`" >> release_body.md
          echo "**构建时间**: ${{ needs.prepare.outputs.build_time }}" >> release_body.md
          echo "" >> release_body.md
          echo "## 下载" >> release_body.md
          echo "" >> release_body.md
          echo "| 平台 | 架构 | 文件 | 大小 | 说明 |" >> release_body.md
          echo "|------|------|------|------|------|" >> release_body.md

          for f in release/*; do
            fname=$(basename "$f")
            [ "$fname" = "SHA256SUMS" ] && continue
            [ -d "$f" ] && continue
            # 升级专用文件（updater- 前缀）不在下载表格显示
            case "$fname" in
              updater-*) continue ;;
            esac
            fsize=$(ls -lh "$f" | awk '{print $5}')

            # 从文件名提取平台和架构
            PLAT=""
            ARCH=""
            case "$fname" in
              *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
              *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
              *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
            esac

            case "$fname" in
              *-install.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 安装包 |" >> release_body.md
                ;;
              *.AppImage)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | AppImage 便携版 |" >> release_body.md
                ;;
              *.deb)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Debian/Ubuntu |" >> release_body.md
                ;;
              *.rpm)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Fedora/RHEL |" >> release_body.md
                ;;
              *.pkg.tar.zst)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Arch Linux |" >> release_body.md
                ;;
              *.zip)
                appname="${fname%.zip}.app"
                echo "| ${PLAT} | ${ARCH} | [${appname}](${RELEASE_URL}/${fname}) | ${fsize} | Mac 应用 |" >> release_body.md
                ;;
            esac
          done

          echo "" >> release_body.md
          echo "## 更新内容" >> release_body.md
          echo "" >> release_body.md
          echo "${CHANGES}" >> release_body.md

      - name: 删除同名旧 Release（如果存在）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Nightly Build
          draft: false
          prerelease: true
          body_path: release_body.md
          files: release/*
