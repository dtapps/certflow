# 每日构建工作流
# 每天 00:00 UTC 自动构建 nightly 版本并发布为 Pre-release
name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 00:00（北京时间 08:00）
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
          - os: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      # 检出代码（fetch-depth: 0 确保能读取所有 tag）
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 生成版本号和构建参数（BUILD_TIME/GIT_COMMIT 供后续步骤统一使用）
      - name: 生成版本号
        id: version
        shell: bash
        run: |
          # 获取最近的 tag
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v0.0.0"
          fi
          # 提取基础版本号（去掉 v 前缀）
          BASE_VERSION="${PREV_TAG#v}"
          # 生成 nightly 版本号：基础版本-nightly.日期
          DATE=$(date +%Y%m%d)
          VERSION="${BASE_VERSION}-nightly.${DATE}"
          BUILD_TIME=$(bash scripts/get-build-time.sh)
          GIT_COMMIT=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "git_commit=${GIT_COMMIT}" >> $GITHUB_OUTPUT
          echo "Nightly 版本号: ${VERSION}"

      # 打印构建参数（与实际构建使用同一份数据，方便排查）
      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ steps.version.outputs.build_time }}"
          echo "VERSION=${{ steps.version.outputs.version }}"
          echo "GIT_COMMIT=${{ steps.version.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      - name: 安装系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      - name: 安装 Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 检查构建环境
        run: wails3 doctor

      - name: 安装 NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          echo $nsisPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # 构建和打包（BUILD_TIME 由上面的步骤统一生成，确保打印和实际使用一致）
      - name: 构建
        shell: bash
        run: wails3 task build BUILD_TIME=${{ steps.version.outputs.build_time }} VERSION=${{ steps.version.outputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN

      - name: 打包
        shell: bash
        run: wails3 task package BUILD_TIME=${{ steps.version.outputs.build_time }} VERSION=${{ steps.version.outputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN

      - name: 重命名产物
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip
          if [ -d "certflow.app" ]; then
            zip -r "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" certflow.app
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 便携版（updater 使用）和安装包（加 install 标识）
          if [ -f "certflow.exe" ]; then
            mv certflow.exe "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.exe"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.exe" renamed/
          fi
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv CertFlow-*-install.exe renamed/
          fi

          # Linux: 二进制文件（updater 使用）和各格式安装包
          if [ -f "certflow" ]; then
            cp certflow "CertFlow-${VERSION}-${PLATFORM}-${ARCH}"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}" renamed/
          fi
          for f in *.AppImage; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.AppImage" && mv CertFlow-*.AppImage renamed/
          done
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.deb" && mv CertFlow-*.deb renamed/
          done
          for f in *.rpm; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.rpm" && mv CertFlow-*.rpm renamed/
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.pkg.tar.zst" && mv CertFlow-*.pkg.tar.zst renamed/
          done

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: certflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 3

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成版本号
        id: version
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG="v0.0.0"
          fi
          BASE_VERSION="${PREV_TAG#v}"
          DATE=$(date +%Y%m%d)
          VERSION="${BASE_VERSION}-nightly.${DATE}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: certflow-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 生成发布说明
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # 获取上一个稳定版本
          PREV_STABLE_TAG=$(git tag --sort=-v:refname | grep -v nightly | head -1)
          if [ -z "$PREV_STABLE_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_STABLE_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          # 生成下载表格
          echo "## ⚠️ Nightly 构建" > release_body.md
          echo "" >> release_body.md
          echo "> 这是每日自动构建的预发布版本，可能包含未测试的功能。" >> release_body.md
          echo "> 如需稳定版本，请使用 [正式发布](https://github.com/${REPO}/releases)。" >> release_body.md
          echo "" >> release_body.md
          echo "**版本**: \`${VERSION}\`" >> release_body.md
          echo "**构建时间**: $(bash scripts/get-build-time.sh)" >> release_body.md
          echo "" >> release_body.md
          echo "## 下载" >> release_body.md
          echo "" >> release_body.md
          echo "| 平台 | 架构 | 文件 | 大小 | 说明 |" >> release_body.md
          echo "|------|------|------|------|------|" >> release_body.md

          for f in release/*; do
            fname=$(basename "$f")
            [ "$fname" = "SHA256SUMS" ] && continue
            [ -d "$f" ] && continue
            fsize=$(ls -lh "$f" | awk '{print $5}')

            # 从文件名提取平台和架构
            PLAT=""
            ARCH=""
            case "$fname" in
              *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
              *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
              *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
            esac

            case "$fname" in
              *.zip)
                appname="${fname%.zip}.app"
                echo "| ${PLAT} | ${ARCH} | [${appname}](${RELEASE_URL}/${fname}) | ${fsize} | Mac 应用 |" >> release_body.md
                ;;
              *-install.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 安装包 |" >> release_body.md
                ;;
              *.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 便携版 |" >> release_body.md
                ;;
              *.AppImage)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | AppImage 便携版 |" >> release_body.md
                ;;
              *.deb)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Debian/Ubuntu |" >> release_body.md
                ;;
              *.rpm)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Fedora/RHEL |" >> release_body.md
                ;;
              *.pkg.tar.zst)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Arch Linux |" >> release_body.md
                ;;
              *)
                # Linux 二进制文件（无扩展名）
                case "$fname" in
                  *-amd64|*-arm64)
                    echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Linux 二进制 |" >> release_body.md
                    ;;
                esac
                ;;
            esac
          done

          echo "" >> release_body.md
          echo "## 更新内容" >> release_body.md
          echo "" >> release_body.md
          echo "${CHANGES}" >> release_body.md

      - name: 删除同名旧 Release（如果存在）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nightly ${{ steps.version.outputs.version }}
          draft: false
          prerelease: true
          body_path: release_body.md
          files: release/*
