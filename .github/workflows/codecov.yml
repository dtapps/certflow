# 覆盖率上报到 Codecov（GitHub 侧，与 CNB 的 testing:coverage 门禁相互独立）
# 职责分离：
#   - CNB 流水线负责硬性红线门禁（lines / diffLines），阻断低覆盖率合并；
#   - 本工作流负责把覆盖率上传到 Codecov（PR 评论 + 徽章 + patch 状态）。
# 因覆盖率产物需在 GitHub Actions 环境内生成，这里自行跑一遍测试（与 CNB 重复，
# 但各自独立，互不依赖）。配置见 .github/codecov.yml。
# https://github.com/codecov/codecov-action
name: Codecov

on:
  push:
  pull_request:

permissions:
  contents: read

# 同一分支的多次 push 取消旧的运行，避免排队浪费。
concurrency:
  group: push-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-24.04 # 需 24.04：libwebkitgtk-6.0-dev 在此版本才有
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Wails 构建依赖（CGO 链接所需）
        # 本项目用 Wails，go test 会链接 GTK4/WebKit 系统库；标准 runner 无这些库会 ld 失败。
        # 与 .cnb/Dockerfile 的 libgtk-4-dev / libwebkitgtk-6.0-dev 保持一致。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: 安装 Go 依赖
        run: go mod download

      # 范围同 CNB 一样
      - name: 生成 Go 测试覆盖率
        # 用 gotestsum 包裹 go test：参数原样透传，coverage.out 照常产出，
        # 同时额外生成 go-test-report.xml（JUnit）供 Codecov 测试分析。
        # gotestsum 固定版本（v1.12.0 依赖的旧 x/tools 无法在 Go 1.27 编译，故用 v1.13.0）。
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          gotestsum --junitfile go-test-report.xml -- -vet=off -coverpkg=$(go list ./internal/... | grep -v '/internal/ent' | paste -sd, -) -coverprofile=coverage.out ./internal/...

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: 生成前端测试覆盖率
        # 额外挂 json reporter（产出 test-results.json），供后续转 JUnit 上传测试结果；
        # coverage/lcov.info 仍正常产出。
        run: pnpm test:coverage --reporter=default --reporter=json --outputFile=test-results.json
        working-directory: frontend

      - name: 构建前端（触发 Bundle Analysis 上传）
        # 仅作体积分析上报，失败（如插件与 Vite 8 不兼容）不应阻断上面的覆盖率上传，故 continue-on-error。
        continue-on-error: true
        working-directory: frontend
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: pnpm build # = vue-tsc && vite build --mode production，构建时插件自动上传 chunk 体积

      - name: 上传 Go 覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: go
          fail_ci_if_error: false

      - name: 上传前端覆盖率到 Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: node
          fail_ci_if_error: false

      - name: 转换 Vitest JSON 为 JUnit XML
        # Vitest 5.0.5 无内置 junit reporter，用内置 json reporter 产出 test-results.json 后再转 JUnit（零依赖脚本）。
        working-directory: frontend
        run: node scripts/vitest-json-to-junit.mjs

      - name: 上传测试结果到 Codecov
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/test-report.xml,./go-test-report.xml
          fail_ci_if_error: false
