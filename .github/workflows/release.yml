# 发布工作流
# 手动触发，输入版本号后自动构建六个平台并发布 GitHub Release
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0）'
        required: true
        type: string
      commit:
        description: '要构建的提交（留空则使用默认分支最新提交）'
        required: false
        type: string
        default: ''
      mac_arm64:
        description: 'macOS Apple Silicon'
        type: boolean
        default: true
      mac_amd64:
        description: 'macOS Intel'
        type: boolean
        default: true
      linux_amd64:
        description: 'Linux x64'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux ARM64'
        type: boolean
        default: true
      windows_amd64:
        description: 'Windows x64'
        type: boolean
        default: true
      windows_arm64:
        description: 'Windows ARM64'
        type: boolean
        default: true
      biometric:
        description: '启用生物识别认证（Touch ID / Windows Hello）'
        type: boolean
        default: false
      sqlite_driver:
        description: 'SQLite 驱动：modernc（纯 Go，默认）/ mattn（CGO，性能更佳需 C 编译器）'
        type: choice
        options:
          - modernc
          - mattn
        default: modernc

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
            enabled: ${{ inputs.mac_arm64 }}
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
            enabled: ${{ inputs.mac_amd64 }}
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
            enabled: ${{ inputs.linux_amd64 }}
          - os: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
            enabled: ${{ inputs.linux_arm64 }}
          - os: windows-2025
            goos: windows
            goarch: amd64
            enabled: ${{ inputs.windows_amd64 }}
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            enabled: ${{ inputs.windows_arm64 }}

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      # Windows Authenticode 签名所需的证书（未配置对应 secret 时签名步骤自动跳过）
      SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
      SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
      SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
      TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}

    steps:
      # 检出代码（必须在版本号生成之前）
      - name: 检出代码
        if: ${{ matrix.enabled }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 生成构建参数（BUILD_TIME 和 GIT_COMMIT 供后续步骤统一使用）
      - name: 生成构建参数
        if: ${{ matrix.enabled }}
        id: build
        shell: bash
        run: |
          echo "build_time=$(bash scripts/get-build-time.sh)" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 打印构建参数
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          echo "BUILD_TIME=${{ steps.build.outputs.build_time }}"
          echo "VERSION=${{ inputs.version }}"
          echo "GIT_COMMIT=${{ steps.build.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      - name: 安装系统依赖
        if: ${{ matrix.enabled && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        if: ${{ matrix.enabled }}
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: 下载 Go 依赖
        if: ${{ matrix.enabled }}
        run: go mod download

      - name: 安装 pnpm
        if: ${{ matrix.enabled }}
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'
          cache: true
          cache_dependency_path: 'frontend/pnpm-lock.yaml'

      - name: 安装 Node.js
        if: ${{ matrix.enabled }}
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'

      - name: 安装前端依赖
        if: ${{ matrix.enabled }}
        run: pnpm install
        working-directory: frontend

      - name: 安装 Wails3
        if: ${{ matrix.enabled }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 检查构建环境
        if: ${{ matrix.enabled }}
        run: wails3 doctor

      - name: 安装 NSIS
        if: ${{ matrix.enabled && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          echo $nsisPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # mattn 是 CGO 驱动，Windows 需要 MinGW 提供的 gcc 才能编译。
      # 注：choco 安装的 mingw 为 x86_64 工具链，仅能产出 windows/amd64 的 mattn 二进制；
      # windows/arm64 选择 mattn 时需 aarch64 MinGW 工具链（标准 runner 无），
      # 故「配置 SQLite 驱动」步骤会对其强制回退 modernc，这里略过 arm64 的 MinGW 安装。
      - name: 安装 MinGW（mattn 需要 CGO 编译器）
        if: ${{ matrix.enabled && inputs.sqlite_driver == 'mattn' && runner.os == 'Windows' && matrix.goarch != 'arm64' }}
        shell: pwsh
        run: |
          choco install mingw -y
          $mingwBin = "${env:ProgramData}\chocolatey\lib\mingw\tools\install\mingw64\bin"
          if (Test-Path $mingwBin) {
            echo $mingwBin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            echo "CC=$mingwBin\gcc.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Warning "MinGW 未出现在预期路径 $mingwBin，mattn (CGO) 构建可能失败"
          }

      # 编译 Windows 生物识别 Helper（仅在启用 biometric 且为 Windows 平台时）
      - name: 安装 .NET SDK
        if: ${{ matrix.enabled && inputs.biometric && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install dotnet-sdk -y
          # 刷新 PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: 编译 Windows 生物识别 Helper
        if: ${{ matrix.enabled && inputs.biometric && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cd native/windows
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true
          # 复制到目标目录
          $targetDir = "../../internal/biometric/binaries/windows"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }
          Copy-Item "bin/Release/net6.0/win-x64/publish/biometric_helper.exe" -Destination $targetDir -Force
          Write-Host "Windows biometric helper compiled and copied to $targetDir"

      # 编译 macOS 生物识别 Helper（仅在启用 biometric 且为 macOS 平台时）
      - name: 编译 macOS 生物识别 Helper
        if: ${{ matrix.enabled && inputs.biometric && runner.os == 'macOS' }}
        shell: bash
        run: |
          cd native/macos
          swiftc -o biometric_helper biometric_helper.swift -framework LocalAuthentication
          # 复制到目标目录
          mkdir -p ../../internal/biometric/binaries/macos
          cp biometric_helper ../../internal/biometric/binaries/macos/
          echo "macOS biometric helper compiled and copied"

      # 根据输入选择 SQLite 驱动：默认 modernc（纯 Go）；可选 mattn（CGO）。
      # darwin/linux 的 native 构建任务已硬编码 CGO_ENABLED=1 且 runner 自带编译器，mattn 直接可用；
      # Windows native 任务读取 CGO_ENABLED Task 变量（默认 0），故 mattn 需显式传入 CGO_ENABLED=1。
      # 将 EXTRA_TAGS / CGO_FLAG 写入 $GITHUB_ENV，供后续构建与打包步骤复用。
      - name: 配置 SQLite 驱动
        if: ${{ matrix.enabled }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          EXTRA_TAGS=""
          if [ "${{ inputs.biometric }}" = "true" ]; then
            EXTRA_TAGS="biometric"
          fi
          # windows/arm64 的 mattn（CGO）需要 aarch64-w64-mingw32 交叉工具链，
          # 标准 Windows runner 仅提供 x86_64 的 MinGW，无法编译 arm64 的 CGO 代码
          # （表现为 gcc 把 AArch64 汇编当 x86 解析导致 `stp`/`ldp` 找不到指令）。
          # 因此该平台强制回退到 modernc（纯 Go，无需 C 编译器），忽略 sqlite_driver 输入。
          if [ "${{ inputs.sqlite_driver }}" = "mattn" ] && [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ]; then
            echo "::warning::windows/arm64 不支持 mattn（CGO）构建，已自动回退到 modernc（纯 Go）"
            echo "CGO_FLAG=" >> "$GITHUB_ENV"
            echo "::notice::使用 modernc.org/sqlite（纯 Go）构建 SQLite"
          elif [ "${{ inputs.sqlite_driver }}" = "mattn" ]; then
            if [ -n "$EXTRA_TAGS" ]; then
              EXTRA_TAGS="$EXTRA_TAGS sqlite_mattn"
            else
              EXTRA_TAGS="sqlite_mattn"
            fi
            echo "CGO_FLAG=CGO_ENABLED=1" >> "$GITHUB_ENV"
            echo "::notice::使用 mattn/go-sqlite3（CGO）构建 SQLite"
          else
            echo "CGO_FLAG=" >> "$GITHUB_ENV"
            echo "::notice::使用 modernc.org/sqlite（纯 Go）构建 SQLite（默认）"
          fi
          echo "EXTRA_TAGS=$EXTRA_TAGS" >> "$GITHUB_ENV"

      # 构建和打包（BUILD_TIME 由上面的步骤统一生成，确保打印和实际使用一致）
      - name: 构建
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_TAGS" ]; then
            EXTRA_ARGS="EXTRA_TAGS=$EXTRA_TAGS"
          fi
          wails3 task build BUILD_TIME=${{ steps.build.outputs.build_time }} PRODUCTION=true VERSION=${{ inputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN $CGO_FLAG $EXTRA_ARGS

      - name: 打包
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_TAGS" ]; then
            EXTRA_ARGS="EXTRA_TAGS=$EXTRA_TAGS"
          fi
          wails3 task package BUILD_TIME=${{ steps.build.outputs.build_time }} PRODUCTION=true VERSION=${{ inputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN $CGO_FLAG $EXTRA_ARGS

      # macOS: 签名 + 公证（解决 Gatekeeper 在系统升级后阻止 App 的问题）
      - name: macOS 签名与公证
        if: ${{ matrix.enabled && runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE != '' }}
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_NOTARIZER_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARIZER_KEYCHAIN_PROFILE }}
        shell: bash
        run: |
          wails3 task darwin:sign:notarize

      # Windows: 将 base64 编码的证书 secret 解码为本地 .pfx 文件
      # WINDOWS_SIGN_CERTIFICATE 中存放的是 .pfx 的 base64（含私钥，禁止入库，仅作 secret）
      - name: 解码 Windows 签名证书
        if: ${{ matrix.enabled && runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        shell: bash
        run: |
          PFX="$RUNNER_TEMP/certflow_authenticode.pfx"
          if echo "$SIGN_CERTIFICATE" | base64 -d > "$PFX" 2>/dev/null; then
            echo "解码为 .pfx 文件: $PFX"
          else
            # secret 本身就是路径（证书已预置在 runner 上）
            PFX="$SIGN_CERTIFICATE"
            echo "使用证书路径: $PFX"
          fi
          echo "SIGN_CERTIFICATE=$PFX" >> "$GITHUB_ENV"

      # Windows: 先签名安装包（-install.exe，用户实际下载的文件，修复 SmartScreen 拦截）
      # windows:sign:installer 内部会重新生成 installer 并签名外层 exe
      - name: Windows 安装包签名
        if: ${{ matrix.enabled && runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign:installer

      # Windows: 再签名独立 exe（供自更新 updater-*.zip 使用，保证替换后的二进制已签名）
      - name: Windows 可执行文件签名
        if: ${{ matrix.enabled && runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign

      - name: 重命名产物
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip。
          # - CertFlow-...-darwin-...zip：打包文件，显示于下载表格（首次安装用）
          # - updater-CertFlow-...-darwin-...zip：升级文件（隐藏）。
          # wails 文档要求 macOS 自更新替换整个 .app 目录以保留 Gatekeeper
          # 签名，故升级文件必须是 .app 归档，不能只压裸二进制。
          if [ -d "certflow.app" ]; then
            zip -r "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" certflow.app
            cp "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 升级专用文件（updater- 前缀，不在下载表格显示）
          # Windows 的 git-bash 不带 zip 命令，改用 PowerShell 内置的 Compress-Archive
          if [ -f "certflow.exe" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -Command "Compress-Archive -Path 'certflow.exe' -DestinationPath 'updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip' -Force"
            else
              zip "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" certflow.exe
            fi
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi
          # Windows: 安装包（打包文件，显示在下载表格）
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv CertFlow-*-install.exe renamed/
          fi

          # Linux: 升级专用文件（updater- 前缀，不在下载表格显示）
          # 用 $PLATFORM 守卫，避免 macOS/Linux 通用的 certflow 二进制被误判为
          # Linux 产物（每个 matrix job 只构建一个平台）。
          if [ "$PLATFORM" = "linux" ] && [ -f "certflow" ]; then
            tar -czf "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" certflow
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" renamed/
          fi
          # Linux: 各格式安装包（打包文件，显示在下载表格）
          for f in *.AppImage; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.AppImage" && mv CertFlow-*.AppImage renamed/
          done
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.deb" && mv CertFlow-*.deb renamed/
          done
          for f in *.rpm; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.rpm" && mv CertFlow-*.rpm renamed/
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.pkg.tar.zst" && mv CertFlow-*.pkg.tar.zst renamed/
          done

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        if: ${{ matrix.enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: certflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: certflow-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 生成发布说明
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          # 生成下载表格
          echo "## 下载" > release_body.md
          echo "" >> release_body.md
          echo "| 平台 | 架构 | 文件 | 大小 | 说明 |" >> release_body.md
          echo "|------|------|------|------|------|" >> release_body.md

          for f in release/*; do
            fname=$(basename "$f")
            [ "$fname" = "SHA256SUMS" ] && continue
            [ -d "$f" ] && continue
            # 升级专用文件（updater- 前缀）不在下载表格显示
            case "$fname" in
              updater-*) continue ;;
            esac
            fsize=$(ls -lh "$f" | awk '{print $5}')

            # 从文件名提取平台和架构
            PLAT=""
            ARCH=""
            case "$fname" in
              *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
              *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
              *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
            esac

            case "$fname" in
              *-install.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 安装包 |" >> release_body.md
                ;;
              *.AppImage)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | AppImage 便携版 |" >> release_body.md
                ;;
              *.deb)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Debian/Ubuntu |" >> release_body.md
                ;;
              *.rpm)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Fedora/RHEL |" >> release_body.md
                ;;
              *.pkg.tar.zst)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Arch Linux |" >> release_body.md
                ;;
              *.zip)
                appname="${fname%.zip}.app"
                echo "| ${PLAT} | ${ARCH} | [${appname}](${RELEASE_URL}/${fname}) | ${fsize} | Mac 应用 |" >> release_body.md
                ;;
            esac
          done

          echo "" >> release_body.md
          echo "## 更新内容" >> release_body.md
          echo "" >> release_body.md
          echo "${CHANGES}" >> release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          body_path: release_body.md
          files: release/*
