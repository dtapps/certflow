# 发布工作流
# 手动触发，输入版本号后自动构建六个平台并发布 GitHub Release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0）'
        required: true
        type: string
      mac_arm64:
        description: 'macOS Apple Silicon'
        type: boolean
        default: true
      mac_amd64:
        description: 'macOS Intel'
        type: boolean
        default: true
      linux_amd64:
        description: 'Linux x64'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux ARM64'
        type: boolean
        default: true
      windows_amd64:
        description: 'Windows x64'
        type: boolean
        default: true
      windows_arm64:
        description: 'Windows ARM64'
        type: boolean
        default: true

permissions:
  contents: write

# https://github.com/actions/runner-images
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
            enabled: ${{ inputs.mac_arm64 }}
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
            enabled: ${{ inputs.mac_amd64 }}
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
            enabled: ${{ inputs.linux_amd64 }}
          - os: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
            enabled: ${{ inputs.linux_arm64 }}
          - os: windows-2025
            goos: windows
            goarch: amd64
            enabled: ${{ inputs.windows_amd64 }}
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            enabled: ${{ inputs.windows_arm64 }}

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

    steps:
      - name: 打印系统信息
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      - name: 检出代码
        if: ${{ matrix.enabled }}
        uses: actions/checkout@v4

      - name: 安装系统依赖
        if: ${{ matrix.enabled && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        if: ${{ matrix.enabled }}
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: 安装 pnpm
        if: ${{ matrix.enabled }}
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        if: ${{ matrix.enabled }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        if: ${{ matrix.enabled }}
        run: pnpm install
        working-directory: frontend

      - name: 安装 Wails3
        if: ${{ matrix.enabled }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 安装 NSIS
        if: ${{ matrix.enabled && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          echo $nsisPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: 构建
        if: ${{ matrix.enabled }}
        shell: bash
        run: wails3 task build PRODUCTION=true VERSION=${{ inputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN 

      - name: 打包
        if: ${{ matrix.enabled }}
        shell: bash
        run: wails3 task package PRODUCTION=true VERSION=${{ inputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN 

      - name: 重命名产物
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip
          if [ -d "certflow.app" ]; then
            zip -r "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" certflow.app
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: NSIS 安装包（优先）或裸 .exe
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.exe"
            done
            mv CertFlow-*.exe renamed/
          elif [ -f "certflow.exe" ]; then
            mv certflow.exe "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.exe"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.exe" renamed/
          fi

          # Linux: AppImage, DEB, RPM, Arch
          for f in *.AppImage; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.AppImage" && mv CertFlow-*.AppImage renamed/
          done
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.deb" && mv CertFlow-*.deb renamed/
          done
          for f in *.rpm; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.rpm" && mv CertFlow-*.rpm renamed/
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.pkg.tar.zst" && mv CertFlow-*.pkg.tar.zst renamed/
          done

          echo "重命名后文件："
          ls -lh renamed/

      - name: 上传产物
        if: ${{ matrix.enabled }}
        uses: actions/upload-artifact@v4
        with:
          name: certflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/renamed/
          if-no-files-found: warn
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: certflow-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      - name: 生成发布说明
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          # 生成下载表格
          echo "## 下载" > release_body.md
          echo "" >> release_body.md
          echo "| 平台 | 架构 | 文件 | 大小 | 说明 |" >> release_body.md
          echo "|------|------|------|------|------|" >> release_body.md

          for f in release/*; do
            fname=$(basename "$f")
            fsize=$(ls -lh "$f" | awk '{print $5}')

            # 从文件名提取平台和架构
            PLAT=""
            ARCH=""
            case "$fname" in
              *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
              *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
              *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
              SHA256SUMS)  PLAT="校验和"; ARCH="-" ;;
            esac

            case "$fname" in
              *.zip)
                appname="${fname%.zip}.app"
                echo "| ${PLAT} | ${ARCH} | [${appname}](${RELEASE_URL}/${fname}) | ${fsize} | Mac 应用 |" >> release_body.md
                ;;
              *.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 安装包 |" >> release_body.md
                ;;
              *.AppImage)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | AppImage 便携版 |" >> release_body.md
                ;;
              *.deb)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Debian/Ubuntu |" >> release_body.md
                ;;
              *.rpm)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Fedora/RHEL |" >> release_body.md
                ;;
              *.pkg.tar.zst)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Arch Linux |" >> release_body.md
                ;;
              SHA256SUMS)
                echo "| ${PLAT} | - | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | SHA-256 |" >> release_body.md
                ;;
            esac
          done

          echo "" >> release_body.md
          echo "## 更新内容" >> release_body.md
          echo "" >> release_body.md
          echo "${CHANGES}" >> release_body.md

      # 生成 SHA256 校验和文件（自更新需要）
      - name: 生成 SHA256SUMS
        run: |
          cd release
          shasum -a 256 * > SHA256SUMS
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          body_path: release_body.md
          files: release/*
