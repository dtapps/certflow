# 发布工作流
# 手动触发，输入版本号后自动构建六个平台并发布 GitHub Release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0）'
        required: true
        type: string
      mac_arm64:
        description: 'macOS Apple Silicon'
        type: boolean
        default: true
      mac_amd64:
        description: 'macOS Intel'
        type: boolean
        default: true
      linux_amd64:
        description: 'Linux x64'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux ARM64'
        type: boolean
        default: true
      windows_amd64:
        description: 'Windows x64'
        type: boolean
        default: true
      windows_arm64:
        description: 'Windows ARM64'
        type: boolean
        default: true

permissions:
  contents: write

# https://github.com/actions/runner-images
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-26
            goos: darwin
            goarch: arm64
            enabled: ${{ inputs.mac_arm64 }}
          # macOS Intel
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
            enabled: ${{ inputs.mac_amd64 }}
          # Linux x64
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
            enabled: ${{ inputs.linux_amd64 }}
          # Linux ARM64
          - os: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
            enabled: ${{ inputs.linux_arm64 }}
          # Windows x64
          - os: windows-2025
            goos: windows
            goarch: amd64
            enabled: ${{ inputs.windows_amd64 }}
          # Windows ARM64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            enabled: ${{ inputs.windows_arm64 }}

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 打印系统信息
      - name: 系统信息
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      # 检出代码
      - uses: actions/checkout@v4
        if: ${{ matrix.enabled }}

      # 安装 Linux 系统依赖（Wails3 需要 GTK4 + WebKit）
      - name: 安装系统依赖
        if: ${{ matrix.enabled && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # 安装 Go（使用稳定版本）
      - uses: actions/setup-go@v5
        if: ${{ matrix.enabled }}
        with:
          go-version-file: 'go.mod'

      # 安装 pnpm
      - uses: pnpm/action-setup@v4
        if: ${{ matrix.enabled }}
        with:
          version: 9

      # 安装 Node.js
      - uses: actions/setup-node@v4
        if: ${{ matrix.enabled }}
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 安装前端依赖
      - name: 安装前端依赖
        if: ${{ matrix.enabled }}
        run: pnpm install
        working-directory: frontend

      # 安装 Wails3 CLI
      - name: 安装 Wails3
        if: ${{ matrix.enabled }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # Windows 安装 NSIS（打包安装包需要）
      - name: 安装 NSIS
        if: ${{ matrix.enabled && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          echo $nsisPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # 构建
      - name: 构建
        if: ${{ matrix.enabled }}
        shell: bash
        run: wails3 task build VERSION=${{ inputs.version }}

      # 打包
      - name: 打包
        if: ${{ matrix.enabled }}
        shell: bash
        run: wails3 task package VERSION=${{ inputs.version }}

      # 上传构建产物
      - name: 上传产物
        if: ${{ matrix.enabled }}
        uses: actions/upload-artifact@v4
        with:
          name: certflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          if-no-files-found: warn
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      # 检出代码
      - uses: actions/checkout@v4

      # 下载所有构建产物（按平台分目录，避免同名覆盖）
      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: certflow-*

      # 整理文件并生成发布说明
      - name: 整理文件并生成发布说明
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          cat > release_body.md << 'EOF'
          ## 下载

          | 平台 | 文件 | 说明 |
          |------|------|------|
          EOF

          # 遍历所有平台子目录中的文件
          find dist -type f \( -name "*.app" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" \) | sort | while read f; do
            fname=$(basename "$f")

            # 提取架构信息
            ARCH=""
            case "$fname" in
              *arm64*|*aarch64*) ARCH="ARM64" ;;
              *amd64*|*x86_64*|*x64*) ARCH="x64" ;;
            esac
            [ -n "$ARCH" ] && ARCH=" (${ARCH})"

            case "$fname" in
              *.app)
                printf '| macOS%s | [%s](%s/%s) | Mac 应用 |\n' "$ARCH" "$fname" "$RELEASE_URL" "$fname" >> release_body.md
                ;;
              *.exe)
                printf '| Windows%s | [%s](%s/%s) | Windows 安装包 |\n' "$ARCH" "$fname" "$RELEASE_URL" "$fname" >> release_body.md
                ;;
              *.AppImage)
                printf '| Linux%s | [%s](%s/%s) | AppImage |\n' "$ARCH" "$fname" "$RELEASE_URL" "$fname" >> release_body.md
                ;;
              *.deb)
                printf '| Linux (DEB)%s | [%s](%s/%s) | Debian/Ubuntu |\n' "$ARCH" "$fname" "$RELEASE_URL" "$fname" >> release_body.md
                ;;
              *.rpm)
                printf '| Linux (RPM)%s | [%s](%s/%s) | Fedora/RHEL |\n' "$ARCH" "$fname" "$RELEASE_URL" "$fname" >> release_body.md
                ;;
              *.pkg.tar.zst)
                printf '| Linux (Arch)%s | [%s](%s/%s) | Arch Linux |\n' "$ARCH" "$fname" "$RELEASE_URL" "$fname" >> release_body.md
                ;;
            esac
          done

          printf '\n## 更新内容\n\n%s\n' "$CHANGES" >> release_body.md

          # 收集所有要上传的文件到 release 目录
          mkdir -p release
          find dist -mindepth 2 \( -name "*.app" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" -o -name "*.dmg" \) | sort | while read f; do
            fname=$(basename "$f")
            cp -r "$f" "release/${fname}"
          done
          echo "发布文件："
          ls -lh release/

      # 创建 GitHub Release 并上传附件
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          body_path: release_body.md
          files: release/*
