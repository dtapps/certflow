# 发布工作流
# 手动触发，输入版本号后自动构建六个平台并发布 GitHub Release
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 1.0.0）'
        required: true
        type: string
      commit:
        description: '要构建的提交（留空则使用默认分支最新提交）'
        required: false
        type: string
        default: ''
      mac_arm64:
        description: 'macOS Apple Silicon'
        type: boolean
        default: true
      mac_amd64:
        description: 'macOS Intel'
        type: boolean
        default: true
      linux_amd64:
        description: 'Linux x64'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux ARM64'
        type: boolean
        default: true
      windows_amd64:
        description: 'Windows x64'
        type: boolean
        default: true
      windows_arm64:
        description: 'Windows ARM64'
        type: boolean
        default: true
      biometric:
        description: '启用生物识别认证（Touch ID / Windows Hello）'
        type: boolean
        default: false

permissions:
  contents: write

# https://github.com/actions/runner-images
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
            enabled: ${{ inputs.mac_arm64 }}
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
            enabled: ${{ inputs.mac_amd64 }}
          - os: ubuntu-26.04
            goos: linux
            goarch: amd64
            enabled: ${{ inputs.linux_amd64 }}
          - os: ubuntu-26.04-arm
            goos: linux
            goarch: arm64
            enabled: ${{ inputs.linux_arm64 }}
          - os: windows-2025
            goos: windows
            goarch: amd64
            enabled: ${{ inputs.windows_amd64 }}
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            enabled: ${{ inputs.windows_arm64 }}

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}

    steps:
      # 检出代码（必须在版本号生成之前）
      - name: 检出代码
        if: ${{ matrix.enabled }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 生成构建参数（BUILD_TIME 和 GIT_COMMIT 供后续步骤统一使用）
      - name: 生成构建参数
        if: ${{ matrix.enabled }}
        id: build
        shell: bash
        run: |
          echo "build_time=$(bash scripts/get-build-time.sh)" >> $GITHUB_OUTPUT
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 打印构建参数
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          echo "BUILD_TIME=${{ steps.build.outputs.build_time }}"
          echo "VERSION=${{ inputs.version }}"
          echo "GIT_COMMIT=${{ steps.build.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      - name: 安装系统依赖
        if: ${{ matrix.enabled && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: 安装 Go
        if: ${{ matrix.enabled }}
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: 安装 pnpm
        if: ${{ matrix.enabled }}
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        if: ${{ matrix.enabled }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖
        if: ${{ matrix.enabled }}
        run: pnpm install
        working-directory: frontend

      - name: 安装 Wails3
        if: ${{ matrix.enabled }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 检查构建环境
        if: ${{ matrix.enabled }}
        run: wails3 doctor

      - name: 安装 NSIS
        if: ${{ matrix.enabled && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          echo $nsisPath | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # 编译 Windows 生物识别 Helper（仅在启用 biometric 且为 Windows 平台时）
      - name: 安装 .NET SDK
        if: ${{ matrix.enabled && inputs.biometric && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install dotnet-sdk -y
          # 刷新 PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

      - name: 编译 Windows 生物识别 Helper
        if: ${{ matrix.enabled && inputs.biometric && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cd native/windows
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true
          # 复制到目标目录
          $targetDir = "../../internal/biometric/binaries/windows"
          if (-not (Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }
          Copy-Item "bin/Release/net6.0/win-x64/publish/biometric_helper.exe" -Destination $targetDir -Force
          Write-Host "Windows biometric helper compiled and copied to $targetDir"

      # 编译 macOS 生物识别 Helper（仅在启用 biometric 且为 macOS 平台时）
      - name: 编译 macOS 生物识别 Helper
        if: ${{ matrix.enabled && inputs.biometric && runner.os == 'macOS' }}
        shell: bash
        run: |
          cd native/macos
          swiftc -o biometric_helper biometric_helper.swift -framework LocalAuthentication
          # 复制到目标目录
          mkdir -p ../../internal/biometric/binaries/macos
          cp biometric_helper ../../internal/biometric/binaries/macos/
          echo "macOS biometric helper compiled and copied"

      # 构建和打包（BUILD_TIME 由上面的步骤统一生成，确保打印和实际使用一致）
      - name: 构建
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.biometric }}" = "true" ]; then
            EXTRA_ARGS="EXTRA_TAGS=biometric"
          fi
          wails3 task build BUILD_TIME=${{ steps.build.outputs.build_time }} PRODUCTION=true VERSION=${{ inputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN $EXTRA_ARGS

      - name: 打包
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.biometric }}" = "true" ]; then
            EXTRA_ARGS="EXTRA_TAGS=biometric"
          fi
          wails3 task package BUILD_TIME=${{ steps.build.outputs.build_time }} PRODUCTION=true VERSION=${{ inputs.version }} GITHUB_TOKEN=$UPDATER_TOKEN $EXTRA_ARGS

      - name: 重命名产物
        if: ${{ matrix.enabled }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip
          if [ -d "certflow.app" ]; then
            zip -r "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" certflow.app
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 便携版（updater 使用）和安装包（加 install 标识）
          if [ -f "certflow.exe" ]; then
            mv certflow.exe "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.exe"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.exe" renamed/
          fi
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv CertFlow-*-install.exe renamed/
          fi

          # Linux: 二进制文件（updater 使用）和各格式安装包
          if [ -f "certflow" ]; then
            cp certflow "CertFlow-${VERSION}-${PLATFORM}-${ARCH}"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}" renamed/
          fi
          for f in *.AppImage; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.AppImage" && mv CertFlow-*.AppImage renamed/
          done
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.deb" && mv CertFlow-*.deb renamed/
          done
          for f in *.rpm; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.rpm" && mv CertFlow-*.rpm renamed/
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.pkg.tar.zst" && mv CertFlow-*.pkg.tar.zst renamed/
          done

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        if: ${{ matrix.enabled }}
        uses: actions/upload-artifact@v4
        with:
          name: certflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: certflow-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd release
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 生成发布说明
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGES="首次发布"
          else
            CHANGES=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null || echo "- 版本更新")
          fi

          # 生成下载表格
          echo "## 下载" > release_body.md
          echo "" >> release_body.md
          echo "| 平台 | 架构 | 文件 | 大小 | 说明 |" >> release_body.md
          echo "|------|------|------|------|------|" >> release_body.md

          for f in release/*; do
            fname=$(basename "$f")
            [ "$fname" = "SHA256SUMS" ] && continue
            [ -d "$f" ] && continue
            fsize=$(ls -lh "$f" | awk '{print $5}')

            # 从文件名提取平台和架构
            PLAT=""
            ARCH=""
            case "$fname" in
              *-darwin-*)  PLAT="macOS"; ARCH="${fname##*-darwin-}"; ARCH="${ARCH%%.*}" ;;
              *-windows-*) PLAT="Windows"; ARCH="${fname##*-windows-}"; ARCH="${ARCH%%.*}" ;;
              *-linux-*)   PLAT="Linux"; ARCH="${fname##*-linux-}"; ARCH="${ARCH%%.*}" ;;
            esac

            case "$fname" in
              *.zip)
                appname="${fname%.zip}.app"
                echo "| ${PLAT} | ${ARCH} | [${appname}](${RELEASE_URL}/${fname}) | ${fsize} | Mac 应用 |" >> release_body.md
                ;;
              *-install.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 安装包 |" >> release_body.md
                ;;
              *.exe)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Windows 便携版 |" >> release_body.md
                ;;
              *.AppImage)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | AppImage 便携版 |" >> release_body.md
                ;;
              *.deb)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Debian/Ubuntu |" >> release_body.md
                ;;
              *.rpm)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Fedora/RHEL |" >> release_body.md
                ;;
              *.pkg.tar.zst)
                echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Arch Linux |" >> release_body.md
                ;;
              *)
                # Linux 二进制文件（无扩展名）
                case "$fname" in
                  *-amd64|*-arm64)
                    echo "| ${PLAT} | ${ARCH} | [${fname}](${RELEASE_URL}/${fname}) | ${fsize} | Linux 二进制 |" >> release_body.md
                    ;;
                esac
                ;;
            esac
          done

          echo "" >> release_body.md
          echo "## 更新内容" >> release_body.md
          echo "" >> release_body.md
          echo "${CHANGES}" >> release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: false
          body_path: release_body.md
          files: release/*
