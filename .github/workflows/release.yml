# 发布工作流
# 两种触发：手动填版本号；每天 UTC 00:00 定时构建 nightly 预发布。
# 均自动构建六个平台并发布 GitHub Release，再同步到 CNB / GitLab / Gitee / GitCode。
#
# 版本号规则（实现见 scripts/ci/resolve-prerelease.sh，CNB 的 .cnb.yml 同口径）：
#   1.2.3                    -> 正式版，Release 不勾选 prerelease
#   1.2.3-rc.1               -> 预发布（rc 渠道）
#   1.2.3-beta.1             -> 预发布（beta 渠道）
#   1.2.3-alpha.1            -> 预发布（alpha 渠道）
#   1.2.3-nightly.20260101   -> 预发布（nightly 渠道）
#   nightly                  -> 定时任务的默认值（手动填也可）：不是版本号，自动推导成
#                               <最近正式版 + 1 个补丁>-nightly.<UTC 构建日期>，
#                               例如最近正式版 v0.2.7 → tag v0.2.8-nightly.20261114。
#                               每天一个 tag，GitHub 上只保留最近 3 个 nightly Release。
#
# 「是不是预发布」不接受人工勾选，只看版本号后缀：布尔输入会和版本号打架。
#
# https://github.com/actions/runner-images
# https://github.com/actions/checkout
# https://github.com/actions/cache
# https://github.com/actions/setup-go
# https://github.com/actions/setup-node
# https://github.com/pnpm/action-setup
# https://github.com/actions/upload-artifact
# https://github.com/actions/download-artifact
# https://github.com/softprops/action-gh-release
# https://github.com/dtapps/golang
name: Release

on:
  # 每天 UTC 00:00（北京时间 08:00）。
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。预发布看后缀：1.2.3-rc.1 / 1.2.3-beta.1 / 1.2.3-alpha.1 / 1.2.3-nightly.20260101；填 nightly 自动生成带日期的 nightly
          版本；无后缀即正式版'
        required: true
        type: string
      commit:
        description: '要构建的提交（留空则使用默认分支最新提交）'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  packages: read # 拉取 GHCR 上的 CI 镜像（公开镜像亦可匿名拉，写上以防仓库转私有）

# 并发策略：同一分支的多次触发串行排队，绝不取消「正在运行」的旧运行。
# cancel-in-progress: false 表示新运行进入 pending 等待，而非抢占/取消 in-progress。
# queue: max 让同一 group 最多保留 100 个 pending（默认 queue: single 只留 1 个，
# 新的会顶掉旧的 pending），按进入等待的先后 FIFO 依次执行，仅队列满的溢出运行被取消。
# 注意：queue: max 不能与 cancel-in-progress: true 组合，否则 workflow 校验失败。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # 统一生成版本号与构建参数（BUILD_TIME / GIT_COMMIT），确保「所有平台注入的 build_time」
  # 与 Release 正文里的构建时间完全一致。
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.gen.outputs.tag }}
      version: ${{ steps.gen.outputs.version }}
      app_version: ${{ steps.gen.outputs.app_version }}
      pre_release: ${{ steps.gen.outputs.pre_release }}
      release_title: ${{ steps.gen.outputs.release_title }}
      build_time: ${{ steps.gen.outputs.build_time }}
      git_commit: ${{ steps.gen.outputs.git_commit }}
      git_commit_full: ${{ steps.gen.outputs.git_commit_full }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # nightly 的基版本要取最近正式版 tag，需要完整 tag 历史
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}
      - name: 解析版本号（预发布看后缀）
        id: gen
        shell: bash
        env:
          # 定时触发没有 inputs，等价于手动填 `nightly`；手动触发仍以输入为准。
          VERSION_INPUT: ${{ github.event_name == 'schedule' && 'nightly' || inputs.version }}
        run: |
          set -euo pipefail

          # 归一化 / 格式校验 / 预发布判定只有一份实现，本流水线与 .cnb.yml 共用
          # shellcheck source=scripts/ci/resolve-prerelease.sh
          . scripts/ci/resolve-prerelease.sh
          # nightly 在这里展开成 v<最近正式版+1补丁>-nightly.<UTC日期>
          resolve_version "${VERSION_INPUT}"
          echo "${PRE_NOTE}"

          # 装进包内的版本必须是纯数字 X.Y.Z：NSIS 的 VIProductVersion 要求 X.X.X.X
          # （模板会拼一个 .0），macOS 的 CFBundleShortVersionString 也只接受数字。
          # 后缀（-rc.1 / -nightly.20260101）只留在 tag、Release 标题与产物文件名里。
          APP_VERSION="${VERSION_BARE%%-*}"
          if printf '%s' "${APP_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            : # 1.2.3，直接用
          elif printf '%s' "${APP_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            APP_VERSION="${APP_VERSION}.0" # 1.2 -> 1.2.0
          else
            echo "::error::版本号 ${TAG} 必须是 X.Y.Z（可带 -rc.1 后缀），当前无法生成安装包版本"
            exit 1
          fi

          # 标题统一带项目名前缀（与 CNB 的 .cnb.yml 同口径，改名字两边一起改）
          PROJECT_NAME="CertFlow"
          if [ "${PRERELEASE}" = "true" ]; then
            RELEASE_TITLE="${PROJECT_NAME} ${TAG} (预发布)"
          else
            RELEASE_TITLE="${PROJECT_NAME} ${TAG}"
          fi

          {
            # tag 用于 git tag / Release 名（统一带 v 前缀）
            echo "tag=${TAG}"
            # version 用于 ldflags 注入与产物文件名，去掉 v 前缀
            # （应用内展示 1.2.3 / 1.2.3-rc.1 / 1.2.4-nightly.20260101）
            echo "version=${VERSION_BARE}"
            # app_version 用于安装包元数据（Info.plist / NSIS / nfpm），必须纯数字
            echo "app_version=${APP_VERSION}"
            echo "pre_release=${PRERELEASE}"
            echo "release_title=${RELEASE_TITLE}"
            echo "build_time=$(bash scripts/get-build-time.sh)"
            echo "git_commit=$(git rev-parse --short HEAD)"
            echo "git_commit_full=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # macOS / Windows：只能用各自的原生 runner（容器方案对这两个平台不适用），
  # 所以保留原生环境 + setup-go / setup-node / pnpm / wails3 安装。
  # Linux 的两条腿在下面的 build-linux 里跑，用统一 CI 镜像。
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            goos: darwin
            goarch: arm64
          - os: macos-26-intel
            goos: darwin
            goarch: amd64
          - os: windows-2025
            goos: windows
            goarch: amd64
          - os: windows-11-arm
            goos: windows
            goarch: arm64

    runs-on: ${{ matrix.os }}

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      # Windows Authenticode 签名所需的证书（未配置对应 secret 时签名步骤自动跳过）
      SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE }}
      SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
      SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
      TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
      # macOS 签名/公证所需证书（同样在 workflow 级定义，才能在步骤 if 中通过 env context 判断；
      # 若定义在步骤级 env，则 if 求值时该 env 尚未设置，会永远为空导致签名步骤永远跳过）。
      APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZER_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARIZER_KEYCHAIN_PROFILE }}

    steps:
      # 检出代码（必须在版本号生成之前）
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 构建参数（BUILD_TIME / GIT_COMMIT）已由 prepare job 统一生成，这里直接引用，
      # 保证所有平台注入的 build_time 与 SHA256SUMS 写入的 build_time 完全一致。
      - name: 打印构建参数
        shell: bash
        run: |
          echo "BUILD_TIME=${{ needs.prepare.outputs.build_time }}"
          echo "VERSION=${{ needs.prepare.outputs.version }}"
          echo "GIT_COMMIT=${{ needs.prepare.outputs.git_commit }}"
          echo "PLATFORM=${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: 打印系统信息
        shell: bash
        run: |
          echo "操作系统: $(uname -a)"
          echo "内核版本: $(uname -r)"
          cat /etc/os-release 2>/dev/null || sw_vers 2>/dev/null || ver 2>/dev/null || true

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      # 缓存 Go module 下载（GOMODCACHE），让 go mod download / wails3 go install
      # 命中已下载的模块，避免重复从 proxy 拉取。
      - name: 缓存 Go module 缓存
        uses: actions/cache@v6
        with:
          # 注意：setup-go 不会注入 GOMODCACHE / GOCACHE 环境变量（仅注入 GOPATH 等），
          # 故 path 必须用确定表达式（HOME + 默认 GOPATH/pkg/mod），不能写 ${{ env.GOMODCACHE }}，
          # 否则 env 为空导致 actions/cache 报 "Input required and not supplied: path"。
          path: ${{ format('{0}/go/pkg/mod', env.HOME) }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      # 缓存 Go 编译缓存（~/.cache/go-build 等），避免每次全量重编。
      # GOCACHE 跨平台路径不同：Windows %LocalAppData%/go-build，macOS ~/Library/Caches/go-build，
      # Linux ~/.cache/go-build；同样不能用 ${{ env.GOCACHE }}（setup-go 未注入）。
      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && format('{0}\\AppData\\Local\\go-build', env.HOME) || runner.os == 'macOS' &&
            format('{0}/Library/Caches/go-build', env.HOME) || format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 下载 Go 依赖
        run: go mod download

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: 'frontend/package.json'

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'

      # 动态获取 pnpm 实际 store 目录（受 PNPM_HOME / 配置影响，写死路径可能 Miss），
      # 写入 $GITHUB_ENV 供下方缓存步骤引用。
      - name: 获取 pnpm store 目录
        id: pnpm-store
        shell: bash
        run: |
          STORE_DIR=$(pnpm config get store-dir)
          echo "PNPM_STORE_DIR=$STORE_DIR" >> "$GITHUB_ENV"

      # 自定义缓存 pnpm store（替代 setup-node 的 cache: 'pnpm'），按 lockfile hash 命中，
      # pnpm install 命中后跳过从 registry 下载，加速前端依赖安装。
      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      # 统一计算 Go 工具链目录并写入 $GITHUB_ENV，供后续所有步骤用 ${{ env.GO_PATH_DIR }}/${{ env.GO_BIN_DIR }} 引用。
      # 必须在步骤级 shell 里算（workflow 级 env 不允许用 runner/env context），避免重复写长表达式。
      - name: 设置 Go 工具链目录
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf '%s\n' 'GO_PATH_DIR=C:\Users\runneradmin\go' >> "$GITHUB_ENV"
            printf '%s\n' 'GO_BIN_DIR=C:\Users\runneradmin\go\bin' >> "$GITHUB_ENV"
          else
            printf '%s\n' "GO_PATH_DIR=$HOME/go" >> "$GITHUB_ENV"
            printf '%s\n' "GO_BIN_DIR=$HOME/go/bin" >> "$GITHUB_ENV"
          fi

      # 安装 wails3 CLI + go-task + NSIS：action 不装 Go（只检查），Go 由上面的 setup-go 提供。
      - name: 安装 Wails3
        uses: dtapps/golang@main
        with:
          framework: wails3
          setup-only: true
          # task = go-task；nsis = Windows 打包用的 makensis（仅 Windows 生效）
          tools: task,nsis
          # action 默认关闭缓存，显式开启：缓存 CLI 二进制与 Windows 的 NSIS 解压目录
          cache: true

      # 环境检查：wails3 doctor 仅做环境体检，不影响实际编译/打包，故允许失败不阻断构建。
      - name: 检查构建环境
        continue-on-error: true
        run: wails3 doctor

      # 固定 SQLite 驱动策略（不提供手动选择）：
      # - Windows 平台使用 modernc（纯 Go，避免 CGO/MinGW 麻烦）
      # - 其他平台（macOS / Linux）使用 mattn（CGO，性能更佳，且这些平台 runner 自带 C 编译器）
      # 将 EXTRA_TAGS / CGO_FLAG 写入 $GITHUB_ENV，供后续构建与打包步骤复用。
      - name: 配置 SQLite 驱动
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          EXTRA_TAGS=""
          if [ "$GOOS" = "windows" ]; then
            # Windows 统一用 modernc（纯 Go），无需 C 编译器
            echo "CGO_FLAG=" >> "$GITHUB_ENV"
            echo "::notice::Windows 使用 modernc.org/sqlite（纯 Go）"
          else
            # macOS / Linux 使用 mattn（CGO），runner 自带 clang/gcc
            if [ -n "$EXTRA_TAGS" ]; then
              EXTRA_TAGS="$EXTRA_TAGS sqlite_mattn"
            else
              EXTRA_TAGS="sqlite_mattn"
            fi
            echo "CGO_FLAG=CGO_ENABLED=1" >> "$GITHUB_ENV"
            echo "::notice::使用 mattn/go-sqlite3（CGO）构建 SQLite"
          fi
          echo "EXTRA_TAGS=$EXTRA_TAGS" >> "$GITHUB_ENV"

      # 发布前：把版本号写入 build/config.yml，再同步到各平台资源
      - name: 同步版本到构建资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          # 必须写纯数字版本：NSIS 的 VIProductVersion / macOS 的 CFBundleShortVersionString
          # 都不接受 -rc.1 这类后缀（会报 invalid VIFileVersion format）
          sed -i.bak -E "s/^([[:space:]]*)version:[[:space:]]*\"[^\"]*\"/\1version: \"${{ needs.prepare.outputs.app_version }}\"/" build/config.yml && rm -f build/config.yml.bak
          echo "✔ build/config.yml 版本号已同步为 ${{ needs.prepare.outputs.app_version }}"

      # 生成图标资源（icns/ico/Assets.car）。所有平台均执行。
      - name: 生成图标资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task common:generate:icons

      - name: 同步版本到构建资源
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task common:update:build-assets

      # 提前拼好所有「跨平台一致」的构建参数，写入 $GITHUB_ENV 供下方构建/打包/签名步骤复用单一字符串，
      - name: 准备构建参数
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$EXTRA_TAGS" ]; then
            EXTRA_ARGS="EXTRA_TAGS=$EXTRA_TAGS"
          fi
          BUILD_ARGS="PRODUCTION=true BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN $CGO_FLAG $EXTRA_ARGS"
          echo "BUILD_ARGS=$BUILD_ARGS" >> "$GITHUB_ENV"
          echo "BUILD_ARGS=$BUILD_ARGS"

      # 构建和打包（BUILD_TIME 由上面的步骤统一生成，确保打印和实际使用一致）
      # - name: 构建（go-task / ${{ matrix.goos }}）
      #   shell: bash
      #   env:
      #     GOPATH: ${{ env.GO_PATH_DIR }}
      #     GOBIN: ${{ env.GO_BIN_DIR }}
      #   run: |
      #     wails3 task ${{ matrix.goos }}:build ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 打包（go-task / ${{ matrix.goos }}）
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task ${{ matrix.goos }}:package ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # macOS: 签名 + 公证（解决 Gatekeeper 在系统升级后阻止 App 的问题）
      - name: macOS 签名与公证
        # 判断用 workflow 级 env（已在 workflow env 中由 secret 赋值），步骤级 env 在 if 求值时尚不存在。
        # 走 go-task 的 darwin 流程并透传与打包一致的变量，避免 wails3 代理时用默认 ARCH 重编错架构。
        if: ${{ runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE != '' }}
        shell: bash
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
        run: |
          wails3 task darwin:sign:notarize ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # Windows: 将 base64 编码的证书 secret 解码为本地 .pfx 文件
      # WINDOWS_SIGN_CERTIFICATE 中存放的是 .pfx 的 base64（含私钥，禁止入库，仅作 secret）
      - name: 解码 Windows 签名证书
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        shell: bash
        run: |
          PFX="$RUNNER_TEMP/certflow_authenticode.pfx"
          if echo "$SIGN_CERTIFICATE" | base64 -d > "$PFX" 2>/dev/null; then
            echo "解码为 .pfx 文件: $PFX"
          else
            # secret 本身就是路径（证书已预置在 runner 上）
            PFX="$SIGN_CERTIFICATE"
            echo "使用证书路径: $PFX"
          fi
          echo "SIGN_CERTIFICATE=$PFX" >> "$GITHUB_ENV"

      # Windows: 先签名安装包（-install.exe，用户实际下载的文件，修复 SmartScreen 拦截）
      # windows:sign:installer 内部会重新生成 installer 并签名外层 exe
      - name: Windows 安装包签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign:installer ARCH=${{ matrix.goarch }} $BUILD_ARGS

      # Windows: 再签名独立 exe（供自更新 updater-*.zip 使用，保证替换后的二进制已签名）
      - name: Windows 可执行文件签名
        if: ${{ runner.os == 'Windows' && env.SIGN_CERTIFICATE != '' }}
        env:
          GOPATH: ${{ env.GO_PATH_DIR }}
          GOBIN: ${{ env.GO_BIN_DIR }}
          SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          WAILS_WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          SIGN_THUMBPRINT: ${{ secrets.WINDOWS_SIGN_THUMBPRINT }}
          TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
        shell: bash
        run: |
          wails3 task windows:sign ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 重命名产物
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          cd bin
          mkdir -p renamed

          # macOS: .app 压缩为 .zip。
          # - CertFlow-...-darwin-...zip：打包文件，显示于下载表格（首次安装用）
          # - updater-CertFlow-...-darwin-...zip：升级文件（隐藏）。
          # wails 文档要求 macOS 自更新替换整个 .app 目录以保留 Gatekeeper
          # 签名，故升级文件必须是 .app 归档，不能只压裸二进制。
          if [ -d "CertFlow.app" ]; then
            zip -r "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" CertFlow.app
            cp "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip"
            mv "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi

          # Windows: 升级专用文件（updater- 前缀，不在下载表格显示）
          # Windows 的 git-bash 不带 zip 命令，改用 PowerShell 内置的 Compress-Archive
          if [ -f "CertFlow.exe" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              pwsh -Command "Compress-Archive -Path 'CertFlow.exe' -DestinationPath 'updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip' -Force"
            else
              zip "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" CertFlow.exe
            fi
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.zip" renamed/
          fi
          # Windows: 安装包（打包文件，显示在下载表格）
          if ls *-installer.exe 1>/dev/null 2>&1; then
            for f in *-installer.exe; do
              mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}-install.exe"
            done
            mv CertFlow-*-install.exe renamed/
          fi

          # Linux: 升级专用文件（updater- 前缀，不在下载表格显示）
          # 用 $PLATFORM 守卫，避免 macOS/Linux 通用的 certflow 二进制被误判为
          # Linux 产物（每个 matrix job 只构建一个平台）。
          if [ "$PLATFORM" = "linux" ] && [ -f "CertFlow" ]; then
            tar -czf "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" CertFlow
            mv "updater-CertFlow-${VERSION}-${PLATFORM}-${ARCH}.tar.gz" renamed/
          fi
          # Linux: 各格式安装包（打包文件，显示在下载表格）
          for f in *.AppImage; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.AppImage" && mv CertFlow-*.AppImage renamed/
          done
          for f in *.deb; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.deb" && mv CertFlow-*.deb renamed/
          done
          for f in *.rpm; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.rpm" && mv CertFlow-*.rpm renamed/
          done
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "CertFlow-${VERSION}-${PLATFORM}-${ARCH}.pkg.tar.zst" && mv CertFlow-*.pkg.tar.zst renamed/
          done

          # 生成本平台的 SHA256 校验和
          cd renamed
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          echo "产物列表："
          ls -lh
          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: certflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/renamed/*
            !bin/renamed/SHA256SUMS
          if-no-files-found: warn
          retention-days: 1

  # Linux 两腿跑在组织统一镜像里（amd64 / arm64 原生镜像），免去 apt 装 GTK/WebKit、
  # setup-go 与 go install wails3；macOS / Windows 用不了容器，留在上面原生 job。
  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            goarch: amd64
          - os: ubuntu-26.04-arm
            goarch: arm64

    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/dtapps/golang/wails3:latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPDATER_TOKEN: ${{ secrets.UPDATER_TOKEN }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      # 容器内无 /dev/fuse：linuxdeploy 是 AppImage，需解包运行
      APPIMAGE_EXTRACT_AND_RUN: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # 容器工作区是 runner 挂进来的 bind mount（属主 runner 用户），进程却是 root：
      # go build 做 VCS 盖章时 git status 会因 dubious ownership 失败。
      - name: 让容器内的 git 可用
        shell: bash
        run: |
          git config --system --add safe.directory '*' 2>/dev/null || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          if git status --porcelain > /dev/null 2>&1; then
            echo "✓ 容器内 git 可用，COMMIT=$(git rev-parse --short HEAD)"
          else
            echo "⚠️ 容器内 git 仍不可用"
          fi

      # 镜像内 GOPATH=/go，工具在 /go/bin 且已在 PATH；缓存路径按容器内实际目录写。
      - name: 缓存 Go module
        uses: actions/cache@v6
        with:
          path: /go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-mod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mod-

      - name: 缓存 Go build 缓存
        uses: actions/cache@v6
        with:
          path: ${{ format('{0}/.cache/go-build', env.HOME) }}
          key: ${{ runner.os }}-${{ matrix.goarch }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: 缓存 pnpm store
        uses: actions/cache@v6
        with:
          path: /root/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: 下载 Go 依赖
        run: go mod download

      - name: 安装前端依赖
        run: pnpm install
        working-directory: frontend

      - name: 同步版本号
        shell: bash
        run: |
          # 包内版本必须是纯数字：deb/rpm/Arch 的 pkgver 与 NSIS 的 VIProductVersion 都不接受 -rc.1
          sed -i -E "s/^([[:space:]]*)version:[[:space:]]*\"[^\"]*\"/\1version: \"${{ needs.prepare.outputs.app_version }}\"/" build/config.yml

      - name: 生成图标与构建资源
        shell: bash
        run: |
          wails3 task common:generate:icons
          wails3 task common:update:build-assets

      # 放在 build-assets 之后：万一步骤 B 会重写 nfpm.yaml，这里再覆盖一次
      - name: 同步 Linux 包版本
        shell: bash
        run: |
          sed -i -E "s/^version: .*/version: \"${{ needs.prepare.outputs.app_version }}\"/" build/linux/nfpm/nfpm.yaml
          grep -n '^version:' build/linux/nfpm/nfpm.yaml

      # Linux 固定用 mattn（CGO）+ sqlite_mattn，与原生 job 的 Linux 分支一致；镜像自带 gcc。
      - name: 打包（linux / ${{ matrix.goarch }}）
        shell: bash
        run: |
          BUILD_ARGS="PRODUCTION=true BUILD_TIME=${{ needs.prepare.outputs.build_time }} VERSION=${{ needs.prepare.outputs.version }} GIT_COMMIT=${{ needs.prepare.outputs.git_commit }} GITHUB_TOKEN=$UPDATER_TOKEN CNB_TOKEN=$CNB_TOKEN CGO_ENABLED=1 EXTRA_TAGS=sqlite_mattn"
          wails3 task linux:package ARCH=${{ matrix.goarch }} $BUILD_ARGS

      - name: 重命名产物
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.goarch }}"
          BASE="CertFlow-${VERSION}-linux-${ARCH}"

          cd bin
          rm -rf renamed
          mkdir -p renamed

          # 升级专用包（不显示在下载表格）
          tar -czf "renamed/updater-${BASE}.tar.gz" CertFlow

          # .pkg.tar.zst 是双后缀，单独判断
          found=0
          for pkg in *.AppImage *.deb *.rpm *.pkg.tar.zst; do
            case "$pkg" in
              *.pkg.tar.zst) ext=".pkg.tar.zst" ;;
              *) ext=".${pkg##*.}" ;;
            esac
            mv "$pkg" "renamed/${BASE}${ext}"
            found=1
          done

          if [ "$found" -ne 1 ]; then
            echo "::error::未找到 linux/${ARCH} 的打包产物"
            ls -la
            exit 1
          fi
          ls -lh renamed

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: certflow-linux-${{ matrix.goarch }}
          path: bin/renamed/*
          if-no-files-found: error
          retention-days: 1

  # 所有平台构建完成后，发布 GitHub Release。
  # 正文/更新内容分别在 scripts/ci/render-release-body.sh 与 release-changelog.sh，
  # CNB / GitLab / Gitee 复用这份正文，只换下载链接域名。
  release:
    needs: [build, build-linux, prepare]
    runs-on: ubuntu-26.04

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 归一化后的 tag：v1.2.3 / v1.2.3-rc.1 / v1.2.4-nightly.20260101
      VERSION: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
      REPO_URL: https://github.com/${{ github.repository }}
      # 正文「提交」行：显示短号、链接用完整 SHA（缩写长度随仓库规模变化，链接里会 404）
      COMMIT_SHA: ${{ needs.prepare.outputs.git_commit_full }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 需要完整 tag 历史，才能按渠道算出「上一个同渠道版本」并生成 changelog
          fetch-depth: 0
          ref: ${{ inputs.commit || github.sha }}

      - name: 下载所有产物
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: certflow-*
          merge-multiple: true

      - name: 显示发布文件
        run: ls -lh release/

      # 发版前先把版本号这件事验干净。这几件事出错都不会让构建失败，
      # 但会发出一个「看起来成功、内容是错的」Release。
      - name: 校验版本号与 tag
        shell: bash
        run: |
          set -euo pipefail
          echo "版本号: ${VERSION}"

          # checkout 已带 fetch-depth: 0，这里再补一次兜底
          git fetch --tags --quiet --force || true
          count=$(git tag -l 'v*' | wc -l | tr -d ' ')
          echo "本地版本 tag: ${count} 个"
          if [ "$count" -eq 0 ]; then
            echo "❌ 一个版本 tag 都没有，changelog 会退化成「首次发布」"
            echo "   检查 checkout 是否带 tag（需要 fetch-depth: 0）"
            exit 1
          fi

          case "${VERSION}" in
            v*)
              # 版本 tag 已存在时：正式版/rc 等不允许重发（会把 tag 挪到新提交，
              # 历史 Release 的对比基准跟着变）；nightly 是同一天重跑，允许删掉重建。
              if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
                case "${VERSION}" in
                  *-nightly.*)
                    echo "✅ nightly tag ${VERSION} 已存在，按同日重跑处理（会删除旧 Release 与 tag 后重建）"
                    ;;
                  *)
                    echo "❌ tag ${VERSION} 已存在，不能重复发布"
                    echo "   已有指向: $(git rev-parse --short "${VERSION}")"
                    echo "   当前 HEAD: $(git rev-parse --short HEAD)"
                    exit 1
                    ;;
                esac
              else
                echo "✅ tag ${VERSION} 不存在，可以发布"
              fi

              # 新版本必须比已有的同渠道/正式版更新，否则正文里的 diff 是反的
              if [ "${PRERELEASE}" = "false" ]; then
                latest=$(git tag -l 'v*' | grep -Ev -- '-(rc|beta|alpha|nightly)' | grep -v '\.rc' | sort -V | tail -n 1 || true)
                if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "${VERSION}" | sort -V | tail -n 1)" != "${VERSION}" ]; then
                  echo "❌ 版本号 ${VERSION} 比已有的正式版 ${latest} 旧"
                  exit 1
                fi
                echo "✅ 比上一个正式版 ${latest:-（无）} 新"
              fi
              ;;
            *)
              echo "::error::版本号 ${VERSION} 必须以 v 开头"
              exit 1
              ;;
          esac

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # 预发布版本：生成 BUILD_TIME / GIT_COMMIT 文件，供 updater 检查更新使用；
          # 文件名与 updater provider 默认 gitCommitFile / buildTimeFile 对齐。
          # 正式版不需要这两个文件（正式版通过 tag 比对来更新）。
          if [ "${PRERELEASE}" = "true" ]; then
            printf '%s\n' "${{ needs.prepare.outputs.build_time }}" > BUILD_TIME
            printf '%s\n' "${{ needs.prepare.outputs.git_commit }}" > GIT_COMMIT
            echo "已生成 BUILD_TIME / GIT_COMMIT（预发布版本）"
          fi
          # 用 GLOBIGNORE 排除自身及不纳入校验的文件，输出裸文件名（无 "./" 前缀），与 updater 解析匹配。
          rm -f SHA256SUMS
          if [ "${PRERELEASE}" = "true" ]; then
            GLOBIGNORE='SHA256SUMS:BUILD_TIME:GIT_COMMIT'
          else
            GLOBIGNORE='SHA256SUMS'
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          unset GLOBIGNORE

          # 追加构建元数据注释（sha256sum 忽略 # 行）：mirror_updater.go 靠这两行
          # 判定 nightly 是否真的更新，缺了会退回 published_at，同一 commit 重打也提示更新。
          {
            printf '# build_time=%s\n' "${{ needs.prepare.outputs.build_time }}"
            printf '# git_commit=%s\n' "${{ needs.prepare.outputs.git_commit }}"
          } >> SHA256SUMS

          echo "SHA256SUMS："
          cat SHA256SUMS

      - name: 生成 Release 正文
        shell: bash
        env:
          # prepare 生成的 ISO8601 构建时间（与 BUILD_TIME 附件、ldflags 注入的完全一致）
          RAW_BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
        run: |
          set -euo pipefail

          # 下载基址在脚本里拼，不写进 env：整条 URL 太长，yamlfmt 会把表达式折行
          DL_BASE="${REPO_URL}/releases/download/${VERSION}"
          STABLE_URL="${REPO_URL}/releases/latest"
          export DL_BASE STABLE_URL

          # 正文里展示成人类可读的 UTC 时间；转换失败就退回原始值，不要因为格式化把发布卡住
          BUILD_TIME="$(date -u -d "${RAW_BUILD_TIME}" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || printf '%s' "${RAW_BUILD_TIME}")"
          export BUILD_TIME

          # 更新内容：按渠道选对比基准（rc 对 rc、beta 对 beta、nightly 对上一个 nightly、
          # 正式版对正式版）。脚本挑不出基准时会 exit 1（而不是谎报
          # 「首次发布」），这里显式接住，避免发出一个正文带错误提示的 Release。
          # GitHub 的提交路径是 /commit/<sha>，和 CNB 的 /-/commit 不同，前缀显式传。
          if ! CHANGELOG="$(COMMIT_URL="${REPO_URL}/commit" sh scripts/ci/release-changelog.sh "${VERSION}")"; then
            echo "❌ 生成更新内容失败，见上面的错误信息"
            exit 1
          fi
          # 直接 export 给同一步的脚本：写 $GITHUB_ENV 只对**后续** step 生效。
          export CHANGELOG

          ARTIFACT_DIR=release OUT_FILE=release_body.md sh scripts/ci/render-release-body.sh

      - name: 删除同名旧 Release（如果存在）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # nightly 同日重跑时同名 tag 已存在：删掉旧 Release 与 tag 再重建，
          # 避免旧平台的附件堆在 Release 上。其它渠道正常情况下 tag 是新的，这里为空操作。
          gh release delete "${VERSION}" --yes --cleanup-tag 2>/dev/null || true

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.release_title }}
          draft: false
          # 版本号带 rc/beta/alpha/nightly 才勾选预发布，正式版不勾（不接受人工输入）
          prerelease: ${{ needs.prepare.outputs.pre_release }}
          body_path: release_body.md
          files: release/*

      - name: 清理旧 nightly Release（只保留最近 3 个）
        if: needs.prepare.outputs.pre_release == 'true' && contains(needs.prepare.outputs.tag, '-nightly.')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 只处理日期 nightly（tag 以 -nightly.YYYYMMDD 结尾），rc / beta / alpha 不动。
          # 用远端 Release 列表而不是本地 git tag：刚发布的 tag 由 action-gh-release
          # 通过 API 创建，当前工作区不一定已经拉到这个 tag 引用。
          mapfile -t nightly < <(
            gh release list --limit 200 --json tagName,isPrerelease,isDraft \
              --jq '.[] | select(.isPrerelease and (.isDraft | not)) | .tagName' \
              | grep -E -- '-nightly\.[0-9]{8}$' \
              | sort -rV || true
          )

          if [ "${#nightly[@]}" -le 3 ]; then
            echo "nightly Release 共 ${#nightly[@]} 个，无需清理"
            exit 0
          fi
          for old in "${nightly[@]:3}"; do
            echo "删除旧 nightly Release: ${old}"
            gh release delete "${old}" --yes --cleanup-tag
          done

  # GitHub Release 发布成功后，触发 CNB 同步构建（把 GitHub Release 镜像到 CNB）。
  # 独立成 job：便于在其后追加 webhook 通知（notify job），也让「同步」与「发布」解耦。
  # 延迟 8 秒：等 GitHub CDN 把刚发布的附件同步好，避免 CNB 侧下载 404。
  # 令牌：cnb.cool → 个人设置 → 访问令牌 → 添加访问令牌（https://cnb.cool/profile/token/create），
  # 授权范围勾 repo-cnb-trigger:rw。与给软件升级下载用的 CNB_TOKEN（repo-release:rw）分开建，互不干扰；
  # 创建后填到 GitHub 仓库 secret SYNC_CNB_TOKEN。
  sync-cnb:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    env:
      SYNC_CNB_TOKEN: ${{ secrets.SYNC_CNB_TOKEN }}
      # 归一化后的 tag（v1.2.3 / v1.2.3-rc.1 / v1.2.4-nightly.20260101）与预发布标记，均来自版本号后缀
      VERSION: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
    steps:
      - name: 触发 CNB 同步构建
        if: ${{ env.SYNC_CNB_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="https://api.cnb.cool"  # 私有化 / 自建端点改这里
          REPO="dtapp/certflow"
          EVENT="api_trigger_release"
          if [ "${PRERELEASE}" = "true" ]; then
            TITLE="GitHub 预发布同步 ${VERSION}"
          else
            TITLE="GitHub 正式发版同步 ${VERSION}"
          fi

          echo "触发 CNB 同步构建: ${API}/${REPO}/-/build/start (event=${EVENT})"
          HTTP=$(curl -s -o /tmp/cnb_start.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${SYNC_CNB_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.cnb.api+json" \
            -d "$(jq -n \
              --arg branch "master" \
              --arg event "$EVENT" \
              --arg title "$TITLE" \
              --arg version "${VERSION}" \
              '{branch: $branch, event: $event, title: $title, env: {version: $version}}')" \
            "${API}/${REPO}/-/build/start")

          echo "CNB build/start 响应 HTTP=${HTTP}"
          cat /tmp/cnb_start.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 CNB 同步构建失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已成功请求 CNB 执行同步构建"
          fi

  # GitHub Release 发布成功后，触发 Gitee Go 流水线（.workflow/release.yml），
  # 由它把 GitHub 资产搬到 Gitee Release 并把正文渲染成 HTML。
  # Gitee Go 没有「调 API 建 Release」的接口，但有 Webhook 触发：
  #   POST <触发地址>，Authorization: Bearer <个人令牌>，
  #   请求体 {"eventType": "...", "payload": {"params": {...}}}
  # eventType 必须逐字等于 .workflow/release.yml 里 triggers.webhook 配的名字
  # （certflow-release），两边改名要一起改。
  # secret：
  #   GITEE_WEBHOOK_URL —— Gitee 流水线详情页给出的 Webhook 触发地址
  #   GITEE_TOKEN       —— Gitee → 个人中心 → 私人令牌
  # 不配也不影响发版，只是 Gitee 那边需要手动点执行。
  sync-gitee:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    env:
      GITEE_WEBHOOK_URL: ${{ secrets.GITEE_WEBHOOK_URL }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      # 归一化后的 tag（v1.2.3 / v1.2.3-rc.1 / v1.2.4-nightly.20260101），预发布由后缀在 Gitee 侧判定
      VERSION: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: 触发 Gitee 发布流水线
        if: ${{ env.GITEE_WEBHOOK_URL != '' && env.GITEE_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          # 只传 VERSION：Gitee 端按 GitHub Release 的 prerelease 字段 + tag 后缀判定，
          # 不再传 PRERELEASE 布尔（两套口径会打架；Gitee 的全局参数开关也已删除）。
          echo "触发 Gitee 流水线: ${VERSION}"

          HTTP=$(curl -s -o /tmp/gitee.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"eventType\":\"certflow-release\",\"payload\":{\"params\":{\"VERSION\":\"${VERSION}\"}}}" \
            "${GITEE_WEBHOOK_URL}")

          echo "Gitee webhook 响应 HTTP=${HTTP}"
          cat /tmp/gitee.json || true
          if [ "${HTTP}" -lt 200 ] || [ "${HTTP}" -ge 300 ]; then
            echo "::warning::触发 Gitee 流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已请求 Gitee 执行发布流水线（异步执行，进度看 Gitee 流水线页面）"
          fi

  # Release 发布成功后触发 GitLab 的 release job（.gitlab-ci.yml，只在 trigger 源下跑：
  # 下载 GitHub 资产 → 传 Generic Package → 建 GitLab Release）。用项目级 trigger token，只触发不绑用户。
  # secret 只有 GITLAB_TRIGGER_TOKEN；仓库/端点/ref 见下方常量（仓库地址取自 README 镜像表）。
  # 令牌：GitLab 项目 → Settings → CI/CD → Pipeline trigger tokens → Add new token（形如 glptt-xxx），
  # 只触发流水线、不绑用户；创建后填到 GitHub 仓库 secret GITLAB_TRIGGER_TOKEN。
  sync-gitlab:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # token 放 job 级 env（step 自己的 env 在 if 求值时还读不到）。
    env:
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
      # 只传 tag：预发布由 .gitlab-ci.yml 按 tag 后缀自行判定（单一真值源）
      VERSION: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: 触发 GitLab 同步流水线
        if: ${{ env.GITLAB_TRIGGER_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="https://gitlab.com/api/v4"   # 自建 GitLab 实例改这里
          PROJECT="dtapps/certflow"         # README 镜像地址表；dtapps 带 s，GitCode 那边是 dtapp
          REF="master"                      # 镜像仓库要构建的分支
          # 路径形式必须 URL 编码（/ → %2F）。
          PROJ=$(printf '%s' "$PROJECT" | jq -sRr @uri)

          echo "触发 GitLab 流水线: ${API}/projects/${PROJ}/trigger/pipeline (ref=${REF})"
          HTTP=$(curl -s -o /tmp/gitlab_trigger.json -w "%{http_code}" -X POST \
            --form "token=${GITLAB_TRIGGER_TOKEN}" \
            --form "ref=${REF}" \
            --form "variables[EVENT]=api_trigger_release" \
            --form "variables[VERSION]=${VERSION}" \
            "${API}/projects/${PROJ}/trigger/pipeline")

          echo "GitLab trigger/pipeline 响应 HTTP=${HTTP}"
          cat /tmp/gitlab_trigger.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 GitLab 同步流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已成功请求 GitLab 执行同步流水线"
          fi

  # Release 发布成功后 dispatch GitCode 的 release.yml（即 .gitcode/workflows/release.yml，
  # 逻辑：下载 GitHub 资产 → 建 GitCode Release → 逐个上传附件），须声明 on: workflow_dispatch。
  # secret 只有 GITCODE_TOKEN（个人令牌）；仓库/端点/workflow/ref 见下方常量（仓库地址取自 README 镜像表）。
  # 令牌：GitCode → 头像 → 个人设置 → 访问令牌 → 新建访问令牌（勾 repo 读写，令牌只显示一次），
  # 创建后填到 GitHub 仓库 secret GITCODE_TOKEN。
  # access_token 按官方要求走 query，故日志不打印完整 URL。
  sync-gitcode:
    needs: [release, prepare]
    runs-on: ubuntu-26.04
    # token 放 job 级 env（step 自己的 env 在 if 求值时还读不到）。
    env:
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      # 只传 tag：GitCode 侧由 tag 后缀自行判定预发布，
      # 不再多传一个布尔（两套口径迟早打架，GitHub 侧已按此原则改造）。
      VERSION: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: 触发 GitCode 同步流水线
        if: ${{ env.GITCODE_TOKEN != '' }}
        shell: bash
        run: |
          echo "等待 8 秒，确保 GitHub Release 附件已同步到 CDN ..."
          sleep 8

          API="https://api.gitcode.com/api/v8"  # 私有化部署改这里
          REPO="dtapp/certflow"                 # README 镜像地址表；dtapp 不带 s，GitLab 那边是 dtapps
          WORKFLOW="release.yml"                # .gitcode/workflows/ 下的文件名，也可填 workflow id
          REF="main"                            # 镜像仓库主分支
          echo "触发 GitCode workflow: ${REPO} / ${WORKFLOW} (ref=${REF})"
          HTTP=$(curl -s -o /tmp/gitcode_dispatch.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg ref "$REF" \
              --arg version "${VERSION}" \
              '{ref: $ref, inputs: {version: $version}}')" \
            "${API}/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches?access_token=${GITCODE_TOKEN}")

          echo "GitCode dispatches 响应 HTTP=${HTTP}"
          cat /tmp/gitcode_dispatch.json
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::warning::触发 GitCode 同步流水线失败（HTTP=${HTTP}），不影响 GitHub Release"
          else
            echo "✓ 已成功请求 GitCode 执行同步流水线"
          fi

  # 构建 / 发布 / 各镜像平台同步全部完成后，通过 ServerChan3（方糖）推送 webhook 通知。
  # 需配置 secret SERVERCHAN_SENDKEY（形如 SCTxxxx 或 sctp{uid}t...）；未配置则跳过通知。
  # API 文档：https://doc.sc3.ft07.com/zh/serverchan3/server/api
  # 推送地址：SCT 转发 key → https://sctapi.ftqq.com/<sendkey>.send
  #          带 uid 的 sendkey（sctp 开头）→ https://<uid>.push.ft07.com/send/<sendkey>.send
  notify:
    # 等所有镜像同步 job 结束（未配置 secret 时它们只是跳过，不影响 success 判定）。
    needs: [sync-cnb, sync-gitee, sync-gitlab, sync-gitcode, release, prepare]
    runs-on: ubuntu-26.04
    if: ${{ needs.release.result == 'success' }}
    env:
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      # 归一化后的 tag 与预发布标记（来自版本号后缀）
      VERSION: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.pre_release }}
    steps:
      - name: 发送 ServerChan3 通知
        if: ${{ env.SERVERCHAN_SENDKEY != '' }}
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        shell: bash
        run: |
          # 支持两种 ServerChan3 key：
          #   - 以 sctp 开头（带 uid 的 sendkey）→ https://<uid>.push.ft07.com/send/<key>.send
          #   - 其他（SCT 转发 key）            → https://sctapi.ftqq.com/<key>.send
          SENDKEY_VAL="$SENDKEY"
          if [[ "$SENDKEY_VAL" =~ ^sctp([0-9]+)t ]]; then
            URL="https://${BASH_REMATCH[1]}.push.ft07.com/send/${SENDKEY_VAL}.send"
          else
            URL="https://sctapi.ftqq.com/${SENDKEY_VAL}.send"
          fi
          # 注意：URL 含 sendkey（密钥），禁止整体打印，仅打印域名避免日志泄露密钥
          echo "推送 ServerChan3 通知: ${URL%%/*}"

          # VERSION / PRERELEASE 来自 job 级 env（版本号后缀判定），这里直接用 tag 值
          TAG="${VERSION}"
          BUILD_TIME="${{ needs.prepare.outputs.build_time }}"
          # 将 UTC 构建时间转换为中国时区（UTC+8）用于通知展示，SHA256SUMS 比对仍用原始 UTC。
          BUILD_TIME_CN=$(date -d "${BUILD_TIME}" -u +'%Y-%m-%d %H:%M:%S' 2>/dev/null)
          BUILD_TIME_CN="${BUILD_TIME_CN} (UTC+8)"
          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"

          TITLE="CertFlow ${TAG} 构建完成"
          TAGS="CertFlow|stable"
          if [ "${PRERELEASE}" = "true" ]; then
            TITLE="CertFlow ${TAG} (预发布) 构建完成"
            TAGS="CertFlow|prerelease"
          fi
          DESP="**版本**: \`${TAG}\`  "$'\n'
          DESP="${DESP}**构建时间**: ${BUILD_TIME_CN}  "$'\n'
          DESP="${DESP}**Git 提交**: ${{ needs.prepare.outputs.git_commit }}  "$'\n'
          DESP="${DESP}**GitHub Release**: [${TAG}](${RELEASE_URL})  "$'\n'
          DESP="${DESP}**CNB Release**: [${TAG}](https://cnb.cool/dtapp/certflow/-/releases/tag/${TAG})  "$'\n'
          DESP="${DESP}**CNB 同步**: 已请求 CNB 执行镜像构建"

          echo "推送 ServerChan3 通知: ${TITLE}"
          HTTP=$(curl -s -o /tmp/sc3.json -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "$TITLE" \
              --arg desp "$DESP" \
              --arg tags "$TAGS" \
              '{title: $title, desp: $desp, tags: $tags}')" \
            "$URL")

          echo "ServerChan3 响应 HTTP=${HTTP}"
          cat /tmp/sc3.json
          if [ "$HTTP" != "200" ]; then
            echo "::warning::ServerChan3 通知发送失败（HTTP=${HTTP}）"
          else
            echo "✓ 已发送 ServerChan3 通知"
          fi
